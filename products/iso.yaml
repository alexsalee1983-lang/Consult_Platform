# ISO/IEC 27001 信息安全管理体系建设与认证准备（二期 D1，公开方法版 v0，负责人 2026-11-18 同意定稿为 ready，待专家复核）
# 格式见 docs/接口约定.md 第二节。资质边界：只做差距分析、认证准备、整改建议，不出具或暗示认证结论。
code: ISO
name: ISO 27001 信息安全管理体系建设
domain: GOV
status: ready
expert_review: pending   # 公开方法版 v0，待专家复核
modules: [DJBH, HYJG]
deliverables:
- code: D1
  title: 启动包
  stage: 启动
  client_facing: true
  outline:
  - 项目范围与目标
  - 评估方法与依据
  - 工作计划
  - 沟通与保密机制
- code: D2
  title: 调研包
  stage: 调研
  client_facing: true
  outline:
  - 调研范围与受访角色
  - 访谈提纲
  - 资料清单
  - 现场工作安排
- code: D3
  title: 事实清单
  stage: 调研
  client_facing: false
  outline:
  - 已确认事实（按评估域）
  - 待补证据与矛盾点
- code: D4
  title: 差距分析报告
  stage: 分析
  client_facing: true
  outline:
  - 评估范围与方法
  - 体系条款差距
  - 附录 A 控制差距
  - 风险与整改建议方向
- code: D5
  title: 风险评估与处置计划
  stage: 设计
  client_facing: true
  outline:
  - 风险评估方法与准则
  - 资产与风险清单
  - 风险处置计划
  - 适用性声明（SoA）
- code: D6
  title: ISMS 文件包
  stage: 设计
  client_facing: true
  outline:
  - 信息安全方针
  - 体系范围说明
  - 风险评估与处置程序
  - 适用性声明
  - 文件化信息控制程序
  - 内部审核程序
  - 管理评审程序
  - 纠正措施程序
- code: D7
  title: 实施与认证准备路线图
  stage: 落地辅导
  client_facing: true
  outline:
  - 体系建设阶段
  - 试运行
  - 内部审核与管理评审
  - 认证准备
  - 里程碑与前置条件
- code: D8
  title: 高层汇报
  stage: 验收
  client_facing: true
  outline:
  - 现状与差距
  - 风险处置重点
  - 认证准备路线图
  - 需要管理层决策的事项
baseline:
  domains:
  - 体系范围与领导作用
  - 风险评估与处置
  - 组织控制
  - 人员控制
  - 物理控制
  - 技术控制
  - 绩效评价与改进
  frameworks:
  - ISO/IEC 27001:2022
  - ISO/IEC 27002:2022
  - 等保 2.0
  basis: []
chain:
- key: facts
  number: 3
  name: 整理事实清单
  agent: research-interview
  inputs:
  - evidence
  output: D3
  query: '{product_name} 现状 事实 调研'
  instruction: 任务：交付链第 {number} 步。根据下面的本项目证据，整理 D3 事实清单：按 {product_name} 的评估域（{domains}）分章列出已确认的事实，每条带证据编号；体系范围（组织单元、场所、业务和系统边界）单列一章；另起一章列“待补证据与矛盾点”。只写证据里有的事实，不推测现状。
- key: gap
  number: 4
  name: 差距分析
  agent: compliance-basis
  inputs:
  - D3
  output: ''
  query: ISO 27001 条款 附录 A 控制 差距分析
  instruction: 任务：交付链第 {number} 步。以下面的 D3 事实清单为输入，对照评估基线（{frameworks}，依据只能来自知识库检索结果，没有的标【依据待核实】）做差距分析：先按标准第 4～10 章（体系要求）逐章，再按附录 A 控制项（5 组织、6 人员、7 物理、8 技术）逐项，输出差距分析表（条款或控制号、现状、要求与依据、差距、证据充分性）、业务影响 TOP 5、依据库缺口。证据不足的项列出来并发“证据不足”确认卡。用“差距分析、认证准备、整改建议”的说法，不出具认证结论，不判断能否通过认证。
- key: risk
  number: 5
  name: 风险评估与控制选择
  agent: solution-designer
  inputs:
  - run:gap
  - D3
  output: ''
  query: ISO 27001 风险评估 风险处置 适用性声明
  instruction: 任务：交付链第 {number} 步。根据下面的差距分析和 D3 事实清单，形成风险评估与控制选择：风险评估方法与准则（可能性、影响、风险等级、可接受准则）、按体系范围列出的资产与风险清单（每条写明对应的差距和证据编号）、风险处置计划（处置方式、控制措施、责任方、期限），以及附录 A 全部 93 项控制的适用性初判（适用或不适用、理由、现状）。风险可接受准则、体系范围边界由客户管理层决定，证据和顾问已确认事项里没有的不要假设，发“范围确认”确认卡；处置方式有两个以上可行选择时，列出选项、推荐和理由，发“方案取舍”确认卡。
- key: policy
  number: 6
  name: ISMS 文件起草
  agent: policy-drafter
  inputs:
  - run:risk
  - D3
  output: D6
  query: ISO 27001 信息安全方针 程序文件 记录
  instruction: 任务：交付链第 {number} 步。根据下面的风险评估与控制选择，起草 D6 ISMS 文件包：信息安全方针、体系范围说明、风险评估与处置程序、适用控制对应的管理制度和程序（文件控制、内部审核、管理评审、纠正措施等标准要求的成文信息），配套记录表单，最后一章写落地风险提示。条款要可执行（谁、何时、做什么、留什么记录）；部门名称只用事实清单里出现过的，客户实际部门或已有制度不清楚时发“范围确认”确认卡，不编造部门；引用依据只用知识库检索结果，不照抄标准原文。
- key: draft
  number: 7
  name: 差距分析报告初稿
  agent: report-writer
  inputs:
  - run:gap
  - D3
  output: D4
  query: ISO 27001 差距分析报告 整改建议
  instruction: 任务：交付链第 {number} 步。根据下面的差距分析和 D3 事实清单，起草 D4 差距分析报告初稿：评估范围与方法、体系要求（第 4～10 章）现状与差距、附录 A 控制现状与差距、主要差距与业务影响、整改建议方向。结论必须来自差距分析，并标注证据编号和依据；这是初稿，供顾问审核署名，不写最终结论口吻。D4 是交给客户的报告：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样）；不写能否通过认证的判断，只写认证准备的差距和整改建议。
- key: risk_doc
  number: 7
  name: 风险评估与处置计划成稿
  agent: report-writer
  inputs:
  - run:risk
  - run:gap
  output: D5
  query: ISO 27001 风险处置计划 适用性声明 SoA
  instruction: 任务：交付链第 {number} 步。根据下面的风险评估与控制选择和差距分析，起草 D5 风险评估与处置计划，按大纲分四章：风险评估方法与准则、资产与风险清单、风险处置计划、适用性声明（SoA）。SoA 必须逐项列出附录 A 全部 93 项控制（5.1～5.37、6.1～6.8、7.1～7.14、8.1～8.34），每项写控制号、是否适用、理由、现状或计划措施，不写标准原文；处置方式以顾问已确认事项为准。保留证据编号和依据标注。D5 是交给客户的文件：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样）。
- key: roadmap
  number: 7
  name: 实施与认证准备路线图成稿
  agent: report-writer
  inputs:
  - run:risk
  - run:gap
  output: D7
  query: ISO 27001 体系建设 认证准备 路线图 内部审核 管理评审
  instruction: 任务：交付链第 {number} 步。根据下面的风险评估与控制选择和差距分析，起草 D7 实施与认证准备路线图：分体系建立、试运行、内部审核与管理评审、认证准备四个阶段写阶段目标、主要任务、责任方、前置条件和里程碑，优先安排业务影响大的差距；资源和时间按客户约束写，不清楚的写成待确认事项。认证审核由客户选定的认证机构实施，路线图只写准备工作，不承诺认证结果。D7 是交给客户的文件：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样）。
- key: briefing
  number: 7
  name: 高层汇报起草
  agent: report-writer
  inputs:
  - D4
  - D5
  - D7
  output: D8
  query: ISO 27001 高层汇报 管理层 决策
  instruction: 任务：交付链第 {number} 步。根据下面的 D4 差距分析报告、D5 风险评估与处置计划和 D7 实施与认证准备路线图，起草 D8 高层汇报：面向客户管理层，每章是一页汇报的要点（现状结论、主要风险与业务影响、风险处置与控制选择概要、路线图与资源需求、需要管理层决策的事项，如体系范围、风险可接受准则、资源投入），结论先行、语言简洁。只用这三份文件里已有的结论并标注来源，不新增结论；用“差距分析、认证准备、整改建议”的说法，不出具认证结论。
gates:
- id: soa-annex-a
  kind: coverage
  deliverable: D5
  items_file: iso27001-annex-a.txt
  level: blocking
  message: 适用性声明未逐项覆盖附录 A 的 93 项控制
- id: soa-section
  kind: required_sections
  deliverable: D5
  sections:
  - 风险处置计划
  - 适用性声明（SoA）
  level: blocking
  message: 风险评估与处置计划缺少风险处置计划或适用性声明章节
- id: no-cert-promise
  kind: forbidden_terms
  deliverable: ''
  terms:
  - 保证通过认证
  - 确保通过认证
  - 承诺通过认证
  - 一次性通过认证
  - 必然通过认证
  - 符合认证要求
  - 可通过审核
  level: blocking
  message: 不得承诺或暗示认证结果（资质边界）
strict:
  card_items:
  - 体系范围与领导作用
  - 风险评估与处置
  - 组织控制
  - 人员控制
  - 物理控制
  - 技术控制
  - 绩效评价与改进

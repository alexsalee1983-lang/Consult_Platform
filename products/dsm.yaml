# 数据安全管理体系建设（二期 D2，公开方法版 v0，负责人 2026-11-18 同意定稿为 ready，待专家复核）
# 范围（4A v4.0）：个人信息保护专项放到五期，本产品不含；个人信息只作为数据类别参与分类分级。
# 格式见 docs/接口约定.md 第二节。资质边界：只做差距分析、符合性初判、整改建议，不出具数据安全评估、个人信息保护认证或能力成熟度等级结论。
code: DSM
name: 数据安全管理体系建设
domain: DAT
status: ready
expert_review: pending   # 公开方法版 v0，待专家复核
modules: [DJBH, HYJG]
deliverables:
- code: D1
  title: 启动包
  stage: 启动
  client_facing: true
  review_profile: light   # 过程材料：只查红线和专项（A13）
  outline:
  - 项目范围与目标
  - 评估方法与依据
  - 工作计划
  - 沟通与保密机制
- code: D2
  title: 调研包
  stage: 调研
  client_facing: true
  review_profile: light   # 过程材料：只查红线和专项（A13）
  outline:
  - 调研范围与受访角色
  - 访谈提纲
  - 资料清单
  - 现场工作安排
- code: D3
  title: 事实清单
  stage: 调研
  client_facing: false
  outline:
  - 已确认事实（按评估域）
  - 待补证据与矛盾点
- code: D4
  title: 数据安全现状评估报告
  stage: 分析
  client_facing: true
  outline:
  - 评估范围与方法
  - 数据安全组织与职责
  - 数据资产与分类分级
  - 数据全生命周期安全
  - 数据出境与共享
  - 监测与事件处置
  - 风险与整改建议方向
- code: D5
  title: 数据分类分级与保护方案
  stage: 设计
  client_facing: true
  outline:
  - 数据资产梳理
  - 分类分级规则
  - 重要数据识别
  - 分级保护要求
  - 数据处理活动安全措施
- code: D6
  title: 数据安全制度文件包
  stage: 设计
  client_facing: true
  outline:
  - 制度体系框架
  - 数据安全管理办法
  - 数据分类分级管理细则
  - 数据安全事件处置流程
  - 落地风险提示
- code: D7
  title: 实施路线图
  stage: 落地辅导
  client_facing: true
  outline:
  - 分阶段目标
  - 主要任务
  - 前置条件与依赖
  - 里程碑
- code: D8
  title: 高层汇报
  stage: 验收
  client_facing: true
  outline:
  - 现状与主要风险
  - 合规差距
  - 建设重点与路线图
  - 需要管理层决策的事项
baseline:
  domains:
  - 数据安全组织与职责
  - 数据资产与分类分级
  - 数据全生命周期安全
  - 数据出境与共享
  - 监测与事件处置
  maturity_scores: false   # A10：数据安全只给符合性条和风险矩阵，不出能力域分数
  frameworks:
  - 数据安全法
  - 网络数据安全管理条例
  - 数据安全能力成熟度模型
  - 行业要求
  basis: []
chain:
- key: facts
  number: 3
  name: 整理事实清单
  agent: research-interview
  inputs:
  - evidence
  output: D3
  query: '{product_name} 现状 事实 调研'
  instruction: 任务：交付链第 {number} 步。根据下面的本项目证据，整理 D3 事实清单：按 {product_name} 的评估域（{domains}）分章列出已确认的事实，每条带证据编号；数据资产和数据处理活动（收集、存储、使用、加工、传输、提供、公开、删除）单列一章，只写类别和数量级，不写数据样本；另起一章列“待补证据与矛盾点”。只写证据里有的事实，不推测现状。
- key: gap
  number: 4
  name: 差距分析
  agent: compliance-basis
  inputs:
  - D3
  output: ''
  query: 数据安全 合规要求 差距分析
  instruction: 任务：交付链第 {number} 步。以下面的 D3 事实清单为输入，对照评估基线（{frameworks}，依据只能来自知识库检索结果，没有的标【依据待核实】）做差距分析：按评估域输出差距分析表（能力域、要求项、现状、要求与依据、差距、证据充分性、影响和可能性各按高 / 中 / 低）、业务影响 TOP 5、依据库缺口，不输出成熟度初判表和分数；涉及重要数据、数据出境、行业数据分类分级的，单独列出适用的行业要求。证据不足的项列出来并发“证据不足”确认卡。用“差距分析、符合性初判、整改建议”的说法，不出具评估、认证或成熟度等级结论。
- key: design
  number: 5
  name: 分类分级与保护设计
  agent: solution-designer
  inputs:
  - run:gap
  - D3
  output: ''
  query: 数据分类分级 重要数据识别 分级保护 数据安全管理体系
  instruction: 任务：交付链第 {number} 步。根据下面的差距分析和 D3 事实清单，设计数据安全管理体系：组织与职责（数据安全负责人、管理机构、岗位）、数据分类分级规则（分类维度、级别定义、定级方法，优先采用行业已有规则）、重要数据识别方法（个人信息只作为数据类别参与分类分级）、分级保护要求、数据处理活动各环节的安全措施、监测与事件处置机制，每项写明对应的差距和证据编号；最后一章写实施路线图草案（分阶段目标、主要任务、前置条件）。重要数据目录以主管部门认定为准，平台和 Agent 不作认定，证据里没有的写成待确认；客户约束（人力、预算、现有工具）找不到的不要假设，发“证据不足”确认卡；有两个以上可行方案时列出选项、推荐和理由，发“方案取舍”确认卡。
- key: policy
  number: 6
  name: 制度文件起草
  agent: policy-drafter
  inputs:
  - run:design
  - D3
  output: D6
  query: 数据安全管理制度 分类分级 制度
  instruction: 任务：交付链第 {number} 步。根据下面的数据安全管理体系设计，起草 D6 数据安全制度文件包：数据安全管理办法，配套的分类分级管理规范、数据处理活动安全规范、数据出境与对外提供审批流程、数据安全事件应急预案、记录表单，最后一章写落地风险提示。条款要可执行（谁、何时、做什么、留什么记录）；部门名称只用设计和事实清单里出现过的，客户实际部门或已有制度不清楚时发“范围确认”确认卡，不编造部门；引用依据只用知识库检索结果。
- key: draft
  number: 7
  name: 现状评估报告初稿
  agent: report-writer
  inputs:
  - run:gap
  - D3
  output: D4
  query: 数据安全现状评估报告 差距 整改建议
  instruction: 任务：交付链第 {number} 步。根据下面的差距分析和 D3 事实清单，起草 D4 数据安全现状评估报告初稿：评估范围与方法、现状概述、主要差距与业务影响、依据说明、整改建议方向。结论必须来自差距分析，并标注证据编号和依据；这是初稿，供顾问审核署名，不写最终结论口吻。D4 是交给客户的报告：不写内部工作内容（差距编号 G-xx、差距分析表原样照搬、确认卡、“测试”“内部”等字样）；这是咨询差距分析，不是数据安全风险评估报告或合规审计报告，不写成主管部门要求报送的评估结论。
- key: design_doc
  number: 7
  name: 分类分级与保护方案成稿
  agent: report-writer
  inputs:
  - run:design
  - run:gap
  output: D5
  query: 数据分类分级方案 分级保护要求
  instruction: 任务：交付链第 {number} 步。根据下面的数据安全管理体系设计和差距分析，起草 D5 数据分类分级与保护方案，按大纲分章：数据资产梳理、分类分级规则、重要数据识别、分级保护要求、数据处理活动安全措施。方案取舍以顾问已确认事项为准；重要数据只写识别方法和候选类别，注明以主管部门认定为准。保留证据编号和依据标注。D5 是交给客户的文件：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样），不写数据样本。
- key: roadmap
  number: 7
  name: 实施路线图成稿
  agent: report-writer
  inputs:
  - run:design
  - run:gap
  output: D7
  query: 数据安全 体系建设 实施路线图 分阶段
  instruction: 任务：交付链第 {number} 步。根据下面数据安全管理体系设计里的路线图草案和差距分析，起草 D7 实施路线图：分近期、中期、远期写阶段目标、主要任务、责任方、前置条件和里程碑，优先安排法定义务和业务影响大的差距；资源和时间按客户约束写，不清楚的写成待确认事项。D7 是交给客户的文件：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样）。
- key: briefing
  number: 7
  name: 高层汇报起草
  agent: report-writer
  inputs:
  - D4
  - D5
  - D7
  output: D8
  query: 数据安全 高层汇报 管理层 决策
  instruction: 任务：交付链第 {number} 步。根据下面的 D4 数据安全现状评估报告、D5 数据分类分级与保护方案和 D7 实施路线图，起草 D8 高层汇报：面向客户管理层，每章是一页汇报的要点（现状结论、主要风险与法律责任、体系设计概要、路线图与资源需求、需要管理层决策的事项，如数据安全负责人、分类分级规则发布、资源投入），结论先行、语言简洁。只用这三份文件里已有的结论并标注来源，不新增结论；用“差距分析、整改建议”的说法，不出具评估、认证或等级结论。
gates:
- id: dsm-sections
  kind: required_sections
  deliverable: D5
  sections:
  - 分类分级规则
  - 分级保护要求
  level: blocking
  message: 分类分级与保护方案缺少分类分级规则或分级保护要求章节
- id: no-assessment-claim
  kind: forbidden_terms
  deliverable: ''
  terms:
  - 已认定为重要数据
  - 通过数据安全评估
  - 通过个人信息保护认证
  - 达到成熟度
  - 符合 DSMM
  - 确保合规
  level: blocking
  message: 不得出具或暗示评估、认证、成熟度等级结论或重要数据认定（资质边界）
strict:
  card_items:
  - 数据安全组织与职责
  - 数据资产与分类分级
  - 数据全生命周期安全
  - 数据出境与共享
  - 监测与事件处置
# 四期 C21（草稿，待产品专家复核）：资料需求清单、受访角色画像、客户自评问卷，全景客户行与答案池（A25/E3）读取。
# 受访角色、预填来源与题库同一词表（docs/题库格式.md）；资料只要统计与配置摘要，不收机密级内容。
inputs:
  materials:
  - {id: M-01, name: 数据安全组织与职责文件, provider: 数据负责人, blocks: {step: facts, deliverables: [D3, D4]}, prefill: org_chart, required: true}
  - {id: M-02, name: 数据资产清单（系统、数据类别与数量，不含数据内容）, provider: 数据负责人, blocks: {step: design, deliverables: [D3, D5]}, prefill: data_inventory, required: true}
  - {id: M-03, name: 现行数据安全与分类分级制度清单, provider: 合规风控, blocks: {step: facts, deliverables: [D3, D6]}, prefill: policy_docs, required: true}
  - {id: M-04, name: 数据共享、委托处理与出境情况统计（对象类别与次数）, provider: 法务, blocks: {step: gap, deliverables: [D4]}, prefill: data_inventory, required: true}
  - {id: M-05, name: 承载重要数据的系统清单（类别与数量）, provider: IT运维, blocks: {step: gap, deliverables: [D4, D5]}, prefill: asset_list, required: false}
  - {id: M-06, name: 近一年数据安全事件与处置记录摘要（去标识）, provider: 安全负责人, blocks: {step: gap, deliverables: [D4]}, prefill: incident_record, required: false}
  - {id: M-07, name: 以往数据安全评估或检查的问题清单, provider: 合规风控, blocks: {step: gap, deliverables: [D4]}, prefill: prior_report, required: false}
  personas:
  - {id: P-01, role: 数据负责人, focus: [数据安全组织与职责, 数据资产与分类分级, 数据全生命周期安全], depth: [quick, full, deep], minutes: 60}
  - {id: P-02, role: 法务, focus: [数据出境与共享], depth: [full, deep], minutes: 45}
  - {id: P-03, role: 合规风控, focus: [数据安全组织与职责, 数据出境与共享], depth: [full, deep], minutes: 45}
  - {id: P-04, role: IT运维, focus: [数据全生命周期安全, 监测与事件处置], depth: [full, deep], minutes: 45}
  - {id: P-05, role: 业务负责人, focus: [数据资产与分类分级, 数据全生命周期安全], depth: [quick, full, deep], minutes: 30}
  - {id: P-06, role: 安全负责人, focus: [监测与事件处置], depth: [full, deep], minutes: 45}
  questionnaire:
    channels: [self]
    kinds: [closed]
    domains: [数据安全组织与职责, 数据资产与分类分级, 数据全生命周期安全, 数据出境与共享, 监测与事件处置]
    max_questions: 30
    due_days: 5

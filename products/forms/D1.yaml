# 四期 A14：D1 启动包表单（各产品通用；顾问填表，平台按模板程序成稿，不调模型）
# 字段类型：text 单行、textarea 多行、list 每行一项（成稿时渲染为列表）
# 模板里用 {字段 key} 引用字段；fixed 为平台固定写入的段落（资质边界、数据保护），顾问不能改
# fixed_by_tier：按项目档位（standard 标准档 / strict 严格档）追加的固定段落，档位取立项时的设置，顾问不另选
# prefill：表单初值取自项目的产品配置（frameworks 评估基线框架、deliverables 交付件清单），顾问可改（自动化优先）
# 第 9 章措辞以 docs/客户数据告知模板与合同条款.md 为准，不得承诺平台做不到的（#468，负责人 2026-11-25 同意 10 章目录）
code: D1
title: 启动包
sections:
- title: 项目概况
  fields:
  - {key: goal, label: 项目目标, type: textarea, required: true}
  - {key: period, label: 项目周期, type: text, required: true, hint: 例如 2027-01-05 至 2027-03-31}
  - {key: background, label: 背景与驱动因素, type: textarea}
  template: |
    **项目目标**

    {goal}

    **项目周期**：{period}

    {background}
- title: 范围确认
  fields:
  - {key: in_scope, label: 本次范围（每行一项）, type: list, required: true}
  - {key: out_of_scope, label: 不包含项（每行一项）, type: list, required: true}
  - {key: assumptions, label: 前提与依赖（每行一项）, type: list}
  template: |
    **本次范围**

    {in_scope}

    **不包含项**

    {out_of_scope}

    **前提与依赖**

    {assumptions}
  fixed: 本项目提供差距分析、符合性初判与整改建议，不出具等级保护测评结论、商用密码应用安全性评估结论或认证结论。
- title: 工作方法与方法论
  fields:
  - {key: frameworks, label: 依据框架与标准（每行一项）, type: list, required: true, prefill: frameworks, hint: 已按产品评估基线预填，可增删}
  - {key: survey_methods, label: 调研方式（每行一项）, type: list, required: true, hint: 例如 访谈、文档审阅、现场查看}
  - {key: approach, label: 方法说明, type: textarea}
  template: |
    **依据框架与标准**

    {frameworks}

    **调研方式**

    {survey_methods}

    {approach}
- title: 工作分解与里程碑
  fields:
  - {key: milestones, label: 阶段与里程碑（每行一项：阶段｜时间｜产出）, type: list, required: true}
  template: |
    {milestones}
- title: 交付件清单与验收
  fields:
  - {key: deliverables, label: 交付件（每行一项：交付件｜时间｜验收人｜验收方式）, type: list, required: true, prefill: deliverables, hint: 已按产品交付件预填，请补时间、验收人和验收方式}
  - {key: acceptance, label: 验收约定, type: textarea, hint: 例如 交付后 5 个工作日内书面确认，逾期无异议视为通过}
  template: |
    **交付件清单**

    {deliverables}

    **验收约定**

    {acceptance}
- title: 组织与沟通
  fields:
  - {key: roles, label: 双方角色与职责（每行一项）, type: list, required: true}
  - {key: communication, label: 沟通机制, type: textarea, hint: 例如 每周例会、周报、即时沟通渠道}
  - {key: escalation, label: 问题升级路径（每行一级）, type: list, required: true, hint: 例如 项目经理 → 双方项目负责人 → 双方分管领导}
  template: |
    **角色与职责**

    {roles}

    **沟通机制**

    {communication}

    **问题升级路径**

    {escalation}
- title: 客户配合事项
  fields:
  - {key: client_materials, label: 请客户提供的资料（每行一项）, type: list, required: true, hint: 只列制度、流程、记录类资料；不收口令、密钥、漏洞细节、完整拓扑与 IP 规划、业务数据和个人信息样本}
  - {key: interviewees, label: 访谈对象与时间（每行一项：对象｜时间）, type: list}
  - {key: access, label: 环境与系统访问安排, type: textarea, hint: 例如 现场办公位、只读查看的系统；顾问不接入生产网络}
  template: |
    **请客户提供的资料**

    {client_materials}

    **访谈对象与时间**

    {interviewees}

    **环境与系统访问**

    {access}
- title: 风险与变更管理
  fields:
  - {key: risks, label: 主要风险与应对（每行一项：风险｜应对）, type: list, required: true}
  - {key: change_control, label: 变更管理（谁提、谁批、怎么记）, type: textarea, required: true, hint: 例如 任一方书面提出，双方项目负责人确认后执行，记入变更记录}
  template: |
    **主要风险与应对**

    {risks}

    **变更管理**

    {change_control}
- title: 客户数据保护安排
  fields:
  - {key: data_notes, label: 双方另行约定的事项, type: textarea, hint: 例如 部分资料仅现场使用；与已签保密协议不一致的，以更严格的约定为准}
  template: |
    {data_notes}
  fixed: 无论哪一档，我方均不收集贵方的账号口令和密钥、可被利用的漏洞细节、完整网络拓扑和 IP 地址规划、业务数据和个人信息样本；贵方误提供的，我方立即删除并告知贵方。贵方资料不提供给任何外部人工智能服务，不用于训练或改进任何模型。
  fixed_by_tier:
    standard: 本项目按标准档处理，按《AI 辅助与数据处理说明》执行：项目验收后，项目专属空间保留 6 个月用于答疑和售后支持，到期后经我方负责人人工确认删除全部项目资料并形成删除记录；贵方可以要求提前删除并获取删除记录。
    strict: 本项目按严格档处理，按双方签署的《数据处理计划》执行：贵方资料、访谈纪要和证据原文全部留在贵方现场，不传输到我方任何服务器；离场后只使用经贵方对接人逐份审阅签字的去标识工作摘要（摘要卡），交付物初稿一律使用占位符。现场资料验收后 5 个工作日内删除并由贵方对接人确认；摘要卡和占位符版本初稿保留 6 个月，经我方负责人人工确认后删除。
- title: 启动会议程与下一步
  fields:
  - {key: agenda, label: 议程（每行一项）, type: list, required: true}
  - {key: meeting, label: 时间与参会人, type: text}
  - {key: next_steps, label: 会后行动（每行一项：事项｜负责人｜时间）, type: list}
  template: |
    {meeting}

    {agenda}

    **会后行动**

    {next_steps}

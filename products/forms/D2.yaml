# 四期 A14：D2 调研包表单（各产品通用；顾问填表，平台按模板程序成稿，不调模型）
# 没有 fields 的章节只进大纲、不写正文（访谈提纲要逐题追溯到评估项，由调研访谈 Agent 起草）
code: D2
title: 调研包
sections:
- title: 调研范围与安排
  fields:
  - {key: departments, label: 调研对象部门（每行一项）, type: list, required: true, example: "信息科技部\n安全运营中心\n风险管理部"}
  - {key: schedule, label: 时间安排, type: textarea, required: true, example: "第 2 周访谈管理层和安全运营团队，第 3 周访谈运维与开发团队，第 4 周补充访谈并核对资料。"}
  - {key: method, label: 调研方式, type: textarea, hint: 例如 访谈、资料审阅、现场观察, example: "关键岗位访谈为主，辅以制度与记录文档审阅、现场只读查看。"}
  template: |
    **调研对象**

    {departments}

    **时间安排**

    {schedule}

    **调研方式**

    {method}
- title: 资料清单
  fields:
  - {key: documents, label: 请客户提供的资料（每行一项）, type: list, required: true, example: "安全管理制度汇编\n安全运营值班记录（近 3 个月）\n组织架构与岗位职责说明"}
  - {key: deadline, label: 提供期限, type: text, example: "2027-01-15 前"}
  template: |
    {documents}

    **提供期限**：{deadline}
  fixed: 资料中不得包含口令、密钥、可利用的漏洞细节、完整网络拓扑与 IP 规划、业务数据和个人信息样本；如需说明，请提供去标识后的摘要。
- title: 访谈对象与日程
  fields:
  - {key: interviewees, label: 访谈角色与日程（每行一项：角色｜时间）, type: list, required: true, example: "安全运营主管｜第 2 周周三上午"}
  template: |
    {interviewees}
- title: 访谈提纲

  - {id: D5-C01, name: 重点任务清单, kind: data, format: xlsx, gen: model, to: [客户], default: true, truth: true}
  - {id: D5-C02, name: 愿景目标与指标表, kind: data, format: xlsx, gen: model, to: [客户, 管理层], default: true}

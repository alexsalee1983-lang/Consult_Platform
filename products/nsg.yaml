  - {id: D7-C04, name: 措施与差距映射, kind: data, format: xlsx, gen: program, to: [客户, 项目组], default: true}
  - {id: D7-C05, name: 投入量级估算, kind: data, format: xlsx, gen: mixed, to: [客户, 管理层], default: true}
  - {id: D7-C06, name: 实施路线图报告, kind: doc, format: docx, gen: mixed, to: [客户], default: true}
  D8:
  - {id: D8-C01, name: 高层汇报 PPT, kind: deck, format: pptx, gen: mixed, to: [管理层], default: true}
  - {id: D8-C02, name: 一页纸摘要, kind: doc, format: docx, gen: mixed, to: [管理层], default: true}
  - {id: D8-C03, name: 预判问答, kind: doc, format: docx, gen: model, to: [项目组], default: true}
  closeout:
  - {id: R-C01, name: 项目复盘, kind: doc, format: docx, gen: program, to: [项目组], default: true}
  - {id: R-C02, name: 经验沉淀候选包, kind: data, format: platform, gen: program, to: [知识中心], default: true}

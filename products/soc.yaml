# SOC 运营体系设计（二期 A2：从代码搬出，只搬不改，决策记录 2026-11-14；A5 补全交付链第 5、6 步和第 7 步 D5、D7、D8）
# 格式见 docs/接口约定.md 第二节。交付链 instruction、query 与一期代码逐字一致（tests/test_soc_config.py 核对）；
# 以后改提示词改这里，走 PR、负责人审批。stage、client_facing 是 A2 补的元数据，暂未被代码使用，待产品专家核对。
code: SOC
name: SOC 运营体系设计
domain: OPS
status: ready
modules: [DJBH, GFYL, HYJG]
deliverables:
- code: D1
  title: 启动包
  stage: 启动
  client_facing: true
  review_profile: light   # 过程材料：只查红线和专项（A13）
- code: D2
  title: 调研包
  stage: 调研
  client_facing: true
  review_profile: light   # 过程材料：只查红线和专项（A13）
- code: D3
  title: 事实清单
  stage: 调研
  client_facing: false
- code: D4
  title: 现状评估报告
  stage: 分析
  client_facing: true
- code: D5
  title: 设计方案
  stage: 设计
  client_facing: true
  # 章节取自 design_doc 步骤任务说明（三期前 SOC 只此一份大纲，其余交付件按任务说明成章）
  outline:
  - 设计目标与原则
  - 目标运营模型
  - 方案取舍说明
  - 设计与主要差距的对应关系
- code: D6
  title: 制度文件包
  stage: 设计
  client_facing: true
- code: D7
  title: 实施路线图
  stage: 设计
  client_facing: true
- code: D8
  title: 高层汇报
  stage: 验收
  client_facing: true
baseline:
  domains:
  - 组织与人员
  - 流程
  - 技术平台与数据源
  - 度量与改进
  frameworks:
  - SOC 能力框架
  - 等保 2.0
  - 行业要求
  basis: []
  # 行业依据（B2 补充）：项目行业与键精确相等时，这些依据在 kb.search / basis.lookup 里加权排前；
  # 写法与知识库依据条目的 ref_document 一致（法规写全名，与依据原文 batch2 的下载清单一致）。
  industry_basis:
    银行:
    - 银行保险机构数据安全管理办法
    - 中国人民银行业务领域数据安全管理办法
    保险:
    - 银行保险机构数据安全管理办法
    电力:
    - 电力监控系统安全防护规定
    - 电力行业网络安全管理办法
    - 电力行业网络安全等级保护管理办法
    证券:
    - 证券期货业网络和信息安全管理办法
    期货:
    - 证券期货业网络和信息安全管理办法
chain:
- key: facts
  number: 3
  name: 整理事实清单
  agent: research-interview
  inputs:
  - evidence
  output: D3
  query: SOC 运营现状 事实 调研
  instruction: 任务：交付链第 3 步。根据下面的本项目证据，整理 D3 事实清单：按 SOC 能力域（组织与人员、流程、技术平台与数据源、度量与改进等）分章列出已确认的事实，每条带证据编号；另起一章列“待补证据与矛盾点”。只写证据里有的事实，不推测现状。
- key: gap
  number: 4
  name: 差距分析
  agent: compliance-basis
  inputs:
  - D3
  output: ''
  query: SOC 能力 差距分析 等保 基线
  instruction: 任务：交付链第 4 步。以下面的 D3 事实清单为输入，对照评估基线（SOC 能力框架、等保 2.0、行业要求，依据只能来自知识库检索结果，没有的标【依据待核实】）做差距分析：按能力域（{domains}）输出差距分析表（能力域、能力项、现状、要求与依据、差距、证据充分性、影响和可能性各按高 / 中 / 低）、按能力域的成熟度初判表（现状、目标各 1～5 分，带依据）、业务影响 TOP 5、依据库缺口。证据不足的项列出来并发“证据不足”确认卡。用“差距分析、符合性初判”的说法，不出具测评或认证结论。
- key: draft
  number: 4
  name: 现状评估报告初稿
  agent: report-writer
  inputs:
  - run:gap
  - D3
  output: D4
  query: SOC 现状评估报告 差距 建议
  instruction: 任务：交付链第 {number} 步。差距分析之后、发现表经顾问确认后起草，此时还没有方案设计。根据下面的差距分析和 D3 事实清单，起草 D4 现状评估报告初稿：评估范围与方法、现状概述、主要差距与业务影响、依据说明、后续建议方向。结论必须来自差距分析，并标注证据编号和依据；这是初稿，供顾问审核署名，不写最终结论口吻。D4 是交给客户的报告：不写内部工作内容（差距编号 G-xx、差距分析表原样照搬、确认卡、“测试”“内部”等字样），差距分析的结论改写成报告语言。单列一章“成熟度初判”，照差距分析的成熟度初判表写一张表（表头：能力域 | 现状（1～5） | 目标（1～5） | 依据），顾问审核时直接改分数，签署后驾驶舱以这张表为准；称“成熟度初判”，不写成等级结论。
  # 三期 C10 槽位规格 v0（公开方法版，规划会话起草，逐条待 zj1 在试用机勾选，专家清单 E16）：
  # D4 四个关键章节 ch1 评估范围与方法、ch2 主要差距与业务影响、ch3 依据说明、ch4 成熟度初判与后续建议方向。
  # v0 全部 required: false，专家勾选前不发“知识不足”卡；chapter 与知识条目的 slot 字段同一写法。
  slots:
  - {id: d4-ch1-method, chapter: SOC.D4.ch1, type: MTD, query: SOC 现状评估 范围界定 评估方法 证据规则, need: 2, required: false, expert_review: pending}
  - {id: d4-ch1-tpl, chapter: SOC.D4.ch1, type: TPL, query: SOC 现状评估报告 结构 模板, need: 1, required: false, expert_review: pending}
  - {id: d4-ch2-method, chapter: SOC.D4.ch2, type: MTD, query: 差距 业务影响 可能性 排序 根因 写法, need: 2, required: false, expert_review: pending}
  - {id: d4-ch2-pit, chapter: SOC.D4.ch2, type: PIT, query: SOC 差距分析 常见坑 基线 资产清单, need: 1, required: false, expert_review: pending}
  - {id: d4-ch3-src, chapter: SOC.D4.ch3, type: SRC, query: 网络安全法 等级保护 安全监测 事件报告 条款, need: 3, required: false, expert_review: pending}
  - {id: d4-ch3-ref, chapter: SOC.D4.ch3, type: REF, query: 等保 2.0 安全监测 集中管控 行业监管 依据解读, need: 2, required: false, expert_review: pending}
  - {id: d4-ch3-method, chapter: SOC.D4.ch3, type: MTD, query: 依据引用 条款号 核对 依据待核实 写法, need: 1, required: false, expert_review: pending}
  - {id: d4-ch4-method, chapter: SOC.D4.ch4, type: MTD, query: SOC 成熟度初判 评分锚定 抽样 目标分, need: 2, required: false, expert_review: pending}
  - {id: d4-ch4-pit, chapter: SOC.D4.ch4, type: PIT, query: 成熟度 打分虚高 平均值陷阱, need: 1, required: false, expert_review: pending}
- key: design
  number: 5
  name: 目标运营模型设计
  agent: solution-designer
  inputs:
  - run:gap
  - D3
  output: ''
  query: SOC 目标运营模型 设计 组织 流程 告警分级
  instruction: 任务：交付链第 5 步。根据下面的差距分析和 D3 事实清单，设计目标运营模型：组织与人员（岗位、编制、值班模式）、流程（监测、分析、响应、通报、改进）、告警分级、平台与数据源、度量指标，每项设计写明对应的差距和证据编号；最后一章写实施路线图草案（分阶段目标、主要任务、前置条件）。客户约束（人力、预算、现有工具、值班模式）只从证据和顾问已确认事项里取，找不到的不要假设，发“证据不足”确认卡；有两个以上可行方案时（如自建或外包值守、平台建设路线），列出选项、推荐和理由，发“方案取舍”确认卡，由顾问拍板。
- key: policy
  number: 6
  name: 制度文件起草
  agent: policy-drafter
  inputs:
  - run:design
  - D3
  output: D6
  query: SOC 运营 管理制度 流程规范 岗位职责
  instruction: 任务：交付链第 6 步。根据下面的目标运营模型，起草 D6 制度文件包：SOC 运营管理办法，配套的流程规范、岗位职责、记录表单、考核要求，最后一章写落地风险提示。条款要可执行（谁、何时、做什么、留什么记录）；部门名称只用目标运营模型和事实清单里出现过的，客户实际部门或已有制度不清楚时发“范围确认”确认卡，不编造部门；引用依据只用知识库检索结果。
- key: design_doc
  number: 7
  name: 设计方案成稿
  agent: report-writer
  inputs:
  - run:design
  - run:gap
  output: D5
  query: SOC 设计方案 目标运营模型
  instruction: 任务：交付链第 7 步。根据下面的目标运营模型和差距分析，起草 D5 设计方案：设计目标与原则、目标运营模型（组织与人员、流程、告警分级、平台与数据源、度量）、方案取舍说明（以顾问已确认事项为准）、设计与主要差距的对应关系。保留证据编号和依据标注。D5 是交给客户的文件：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样），改写成方案语言。
  # 三期 C10 槽位规格 v0：D5 四个关键章节（同 outline）ch1 设计目标与原则、ch2 目标运营模型、
  # ch3 方案取舍说明、ch4 设计与主要差距的对应关系；全部待专家勾选。
  slots:
  - {id: d5-ch1-method, chapter: SOC.D5.ch1, type: MTD, query: SOC 目标运营模型 设计步骤 设计原则, need: 1, required: false, expert_review: pending}
  - {id: d5-ch1-rar, chapter: SOC.D5.ch1, type: RAR, query: SOC 参考架构 集中 混合 运营体系, need: 1, required: false, expert_review: pending}
  - {id: d5-ch2-org, chapter: SOC.D5.ch2, type: MTD, query: SOC 组织模式 岗位设计 编制估算 班次 值班, need: 2, required: false, expert_review: pending}
  - {id: d5-ch2-proc, chapter: SOC.D5.ch2, type: MTD, query: 事件分级 告警研判 升级 处置流程 SLA, need: 2, required: false, expert_review: pending}
  - {id: d5-ch2-tech, chapter: SOC.D5.ch2, type: MTD, query: 日志源 接入优先级 检测用例 平台 数据源, need: 2, required: false, expert_review: pending}
  - {id: d5-ch2-metric, chapter: SOC.D5.ch2, type: MTD, query: SOC 度量指标 分层 MTTD MTTR 基线, need: 1, required: false, expert_review: pending}
  - {id: d5-ch3-method, chapter: SOC.D5.ch3, type: MTD, query: 自建 外包 混合 选型 取舍 托管服务评估, need: 2, required: false, expert_review: pending}
  - {id: d5-ch3-obj, chapter: SOC.D5.ch3, type: OBJ, query: 为什么不外包 自建还是购买 人力不足 异议应答, need: 2, required: false, expert_review: pending}
  - {id: d5-ch4-map, chapter: SOC.D5.ch4, type: MTD, query: 差距 设计 对应 投资优先级 速赢, need: 1, required: false, expert_review: pending}
  - {id: d5-ch4-pit, chapter: SOC.D5.ch4, type: PIT, query: 路线图 愿望清单 照搬组织架构 只算编制, need: 1, required: false, expert_review: pending}
- key: roadmap
  number: 7
  name: 实施路线图成稿
  agent: report-writer
  inputs:
  - run:design
  - run:gap
  output: D7
  query: SOC 建设 实施路线图 分阶段
  instruction: 任务：交付链第 7 步。根据下面目标运营模型里的路线图草案和差距分析，起草 D7 实施路线图：分近期、中期、远期写阶段目标、主要任务、责任方、前置条件和里程碑，优先安排业务影响大的差距；资源和时间按客户约束写，不清楚的写成待确认事项。D7 是交给客户的文件：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样）。
- key: briefing
  number: 7
  name: 高层汇报起草
  agent: report-writer
  inputs:
  - D4
  - D5
  - D7
  output: D8
  query: SOC 高层汇报 管理层 决策
  instruction: 任务：交付链第 7 步。根据下面的 D4 现状评估报告、D5 设计方案和 D7 实施路线图，起草 D8 高层汇报：面向客户管理层，每章是一页汇报的要点（现状结论、主要风险与业务影响、目标运营模型概要、路线图与资源需求、需要管理层决策的事项），结论先行、语言简洁。只用这三份文件里已有的结论并标注来源，不新增结论；用“差距分析、整改建议”的说法，不出具测评或认证结论。
gates:
- id: soc-sections
  kind: required_sections
  deliverable: D5
  sections:
  - 设计目标
  - 目标运营模型
  level: blocking
  message: 设计方案缺少设计目标或目标运营模型章节
strict:
  card_items: []
# 三期 C13 最小版（草稿）：缺槽专题访谈上限，kb-builder 模式 H 读取；平台接入前仅作配置草稿
interview:
  weekly_limit_per_expert: 3
  max_questions: 5

- code: D2
  title: 调研包
  stage: 调研
  client_facing: true
- code: D3
  title: 事实清单
  stage: 调研
  client_facing: false
- code: D4
  title: 现状评估报告
  stage: 分析
  client_facing: true
- code: D5
  title: 设计方案
  stage: 设计

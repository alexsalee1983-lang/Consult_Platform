# SOC 运营体系设计（二期 A2：从代码搬出，只搬不改，决策记录 2026-11-14；A5 补全交付链第 5、6 步和第 7 步 D5、D7、D8）
# 格式见 docs/接口约定.md 第二节。交付链 instruction、query 与一期代码逐字一致（tests/test_soc_config.py 核对）；
# 以后改提示词改这里，走 PR、负责人审批。stage、client_facing 是 A2 补的元数据，暂未被代码使用，待产品专家核对。
code: SOC
name: SOC 运营体系设计
domain: OPS
status: ready
modules: []
deliverables:
- code: D1
  title: 启动包
  stage: 启动
  client_facing: true
- code: D2
  title: 调研包
  stage: 调研
  client_facing: true
- code: D3
  title: 事实清单
  stage: 调研
  client_facing: false
- code: D4
  title: 现状评估报告
  stage: 分析
  client_facing: true
- code: D5
  title: 设计方案
  stage: 设计
  client_facing: true
- code: D6
  title: 制度文件包
  stage: 设计
  client_facing: true
- code: D7
  title: 实施路线图
  stage: 设计
  client_facing: true
- code: D8
  title: 高层汇报
  stage: 验收
  client_facing: true
baseline:
  domains:
  - 组织与人员
  - 流程
  - 技术平台与数据源
  - 度量与改进
  frameworks:
  - SOC 能力框架
  - 等保 2.0
  - 行业要求
  basis: []
chain:
- key: facts
  number: 3
  name: 整理事实清单
  agent: research-interview
  inputs:
  - evidence
  output: D3
  query: SOC 运营现状 事实 调研
  instruction: 任务：交付链第 3 步。根据下面的本项目证据，整理 D3 事实清单：按 SOC 能力域（组织与人员、流程、技术平台与数据源、度量与改进等）分章列出已确认的事实，每条带证据编号；另起一章列“待补证据与矛盾点”。只写证据里有的事实，不推测现状。
- key: gap
  number: 4
  name: 差距分析
  agent: compliance-basis
  inputs:
  - D3
  output: ''
  query: SOC 能力 差距分析 等保 基线
  instruction: 任务：交付链第 4 步。以下面的 D3 事实清单为输入，对照评估基线（SOC 能力框架、等保 2.0、行业要求，依据只能来自知识库检索结果，没有的标【依据待核实】）做差距分析：输出差距分析表（能力项、现状、要求与依据、差距、证据充分性）、业务影响 TOP 5、依据库缺口。证据不足的项列出来并发“证据不足”确认卡。用“差距分析、符合性初判”的说法，不出具测评或认证结论。
- key: design
  number: 5
  name: 目标运营模型设计
  agent: solution-designer
  inputs:
  - run:gap
  - D3
  output: ''
  query: SOC 目标运营模型 设计 组织 流程 告警分级
  instruction: 任务：交付链第 5 步。根据下面的差距分析和 D3 事实清单，设计目标运营模型：组织与人员（岗位、编制、值班模式）、流程（监测、分析、响应、通报、改进）、告警分级、平台与数据源、度量指标，每项设计写明对应的差距和证据编号；最后一章写实施路线图草案（分阶段目标、主要任务、前置条件）。客户约束（人力、预算、现有工具、值班模式）只从证据和顾问已确认事项里取，找不到的不要假设，发“证据不足”确认卡；有两个以上可行方案时（如自建或外包值守、平台建设路线），列出选项、推荐和理由，发“方案取舍”确认卡，由顾问拍板。
- key: policy
  number: 6
  name: 制度文件起草
  agent: policy-drafter
  inputs:
  - run:design
  - D3
  output: D6
  query: SOC 运营 管理制度 流程规范 岗位职责
  instruction: 任务：交付链第 6 步。根据下面的目标运营模型，起草 D6 制度文件包：SOC 运营管理办法，配套的流程规范、岗位职责、记录表单、考核要求，最后一章写落地风险提示。条款要可执行（谁、何时、做什么、留什么记录）；部门名称只用目标运营模型和事实清单里出现过的，客户实际部门或已有制度不清楚时发“范围确认”确认卡，不编造部门；引用依据只用知识库检索结果。
- key: draft
  number: 7
  name: 现状评估报告初稿
  agent: report-writer
  inputs:
  - run:gap
  - D3
  output: D4
  query: SOC 现状评估报告 差距 建议
  instruction: 任务：交付链第 7 步。根据下面的差距分析和 D3 事实清单，起草 D4 现状评估报告初稿：评估范围与方法、现状概述、主要差距与业务影响、依据说明、后续建议方向。结论必须来自差距分析，并标注证据编号和依据；这是初稿，供顾问审核署名，不写最终结论口吻。D4 是交给客户的报告：不写内部工作内容（差距编号 G-xx、差距分析表原样照搬、确认卡、“测试”“内部”等字样），差距分析的结论改写成报告语言。
- key: design_doc
  number: 7
  name: 设计方案成稿
  agent: report-writer
  inputs:
  - run:design
  - run:gap
  output: D5
  query: SOC 设计方案 目标运营模型
  instruction: 任务：交付链第 7 步。根据下面的目标运营模型和差距分析，起草 D5 设计方案：设计目标与原则、目标运营模型（组织与人员、流程、告警分级、平台与数据源、度量）、方案取舍说明（以顾问已确认事项为准）、设计与主要差距的对应关系。保留证据编号和依据标注。D5 是交给客户的文件：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样），改写成方案语言。
- key: roadmap
  number: 7
  name: 实施路线图成稿
  agent: report-writer
  inputs:
  - run:design
  - run:gap
  output: D7
  query: SOC 建设 实施路线图 分阶段
  instruction: 任务：交付链第 7 步。根据下面目标运营模型里的路线图草案和差距分析，起草 D7 实施路线图：分近期、中期、远期写阶段目标、主要任务、责任方、前置条件和里程碑，优先安排业务影响大的差距；资源和时间按客户约束写，不清楚的写成待确认事项。D7 是交给客户的文件：不写内部工作内容（差距编号 G-xx、确认卡、“测试”“内部”等字样）。
- key: briefing
  number: 7
  name: 高层汇报起草
  agent: report-writer
  inputs:
  - D4
  - D5
  - D7
  output: D8
  query: SOC 高层汇报 管理层 决策
  instruction: 任务：交付链第 7 步。根据下面的 D4 现状评估报告、D5 设计方案和 D7 实施路线图，起草 D8 高层汇报：面向客户管理层，每章是一页汇报的要点（现状结论、主要风险与业务影响、目标运营模型概要、路线图与资源需求、需要管理层决策的事项），结论先行、语言简洁。只用这三份文件里已有的结论并标注来源，不新增结论；用“差距分析、整改建议”的说法，不出具测评或认证结论。
gates: []
strict:
  card_items: []

  - {id: M-04, name: 应急预案与处置剧本目录, provider: 安全负责人, blocks: {step: policy, deliverables: [D6]}, prefill: runbooks, required: true}
  - {id: M-05, name: 对外通报与监管报送记录（去标识）, provider: 合规风控, blocks: {step: gap, deliverables: [D4]}, prefill: incident_record, required: false}
  - {id: M-06, name: 安全管理制度与职责文件, provider: 安全负责人, blocks: {step: design, deliverables: [D5]}, prefill: policy_docs, required: false}
  - {id: M-07, name: 恢复与业务连续性演练记录摘要, provider: 业务负责人, blocks: {step: gap, deliverables: [D4, D5]}, prefill: prior_report, required: false}

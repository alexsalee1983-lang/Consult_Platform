inputs:
  materials:
  - {id: M-01, name: 事件处置记录与时间线（去标识）, provider: 安全负责人, blocks: {step: facts, deliverables: [D3, D4]}, prefill: incident_record, required: true}
  - {id: M-02, name: 受影响系统与业务清单（类别与数量）, provider: IT运维, blocks: {step: facts, deliverables: [D3, D4]}, prefill: asset_list, required: true}

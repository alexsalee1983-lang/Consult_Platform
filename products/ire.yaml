  - {id: P-02, role: 安全分析, focus: [检测与监测, 响应与处置], depth: [full, deep], minutes: 60}
  - {id: P-03, role: IT运维, focus: [防护, 恢复与业务连续性], depth: [full, deep], minutes: 45}
  - {id: P-04, role: 业务负责人, focus: [事件经过与影响, 恢复与业务连续性], depth: [quick, full, deep], minutes: 30}
  - {id: P-05, role: 合规风控, focus: [通报与报告], depth: [full, deep], minutes: 30}

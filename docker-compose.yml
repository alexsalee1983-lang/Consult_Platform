name: consult-platform

# 一期单机部署：2 台服务器中的应用服务器。所有端口默认只开放 Web 入口 8080，
# 数据库、缓存只在内部网络可达；调试端口绑定在 127.0.0.1。
# 对象存储（项目区 / 知识区文件）：MinIO 源码自建镜像，只在内部网络可达，见 deploy/minio/README.md。

services:
  postgres:
    # PostgreSQL 16 + pgvector + zhparser 中文分词，见 deploy/postgres/README.md
    build:
      context: ./deploy/postgres
      args:
        SCWS_URL: ${SCWS_URL:-http://www.xunsearch.com/scws/down/scws-1.2.3.tar.bz2}
        ZHPARSER_URL: ${ZHPARSER_URL:-https://github.com/amutu/zhparser/archive/refs/tags/v2.3.tar.gz}
    image: consult-platform-postgres:pg16-zh
    restart: unless-stopped
    environment:
      POSTGRES_DB: consult
      POSTGRES_USER: consult
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consult}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consult -d consult"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 对象存储（S3 接口），见 deploy/minio/README.md。不映射端口，只有后端在内部网络访问
    build:
      context: ./deploy/minio
      args:
        MINIO_SRC_URL: ${MINIO_SRC_URL:-https://github.com/minio/minio/archive/refs/tags/RELEASE.2025-10-15T17-29-55Z.tar.gz}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: consult-platform-minio:2025-10-15
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env 设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请在 .env 设置 MINIO_SECRET_KEY（生成方法见 .env.example）}
      # 服务端加密主密钥，格式 <名称>:<32 字节 Base64>；丢失则数据无法解密，要与数据卷分开备份
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?请在 .env 设置 MINIO_KMS_SECRET_KEY（生成方法见 .env.example）}
      MINIO_KMS_AUTO_ENCRYPTION: "on"
      MINIO_BROWSER: "off"            # 不启用管理控制台
      MINIO_UPDATE: "off"             # 不联网检查更新
    volumes:
      - miniodata:/data

  embed:
    # 向量服务：CPU 上运行小型中文向量模型（BAAI/bge-small-zh-v1.5，512 维），OpenAI 兼容 /v1/embeddings，
    # 见 tools/embed。模型在构建时下载进镜像，运行时不联网；不映射端口。公司模型平台的 embedding 就绪后，
    # 在 .env 设 EMBED_BASE_URL / EMBED_MODEL 指向它，可以不再启动本服务（决策记录 2026-11-08）。
    build:
      context: ./tools/embed
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    image: consult-platform-embed:bge-small-zh-v1.5
    restart: unless-stopped

  rerank:
    # 重排服务（决策记录 2026-11-11）：CPU 上运行交叉编码重排模型 bge-reranker-v2-m3（默认 int8 量化版，约 0.6 GB），
    # /v1/rerank，见 tools/rerank。知识检索在 RRF 融合后用它给候选片段重新打分；模型在构建时下载进镜像，运行时不联网；不映射端口。
    # 换完整版：.env 设 RERANK_MODEL=BAAI/bge-reranker-v2-m3 和 RERANK_IMAGE_TAG=bge-reranker-v2-m3，重新构建 rerank 并重建 backend。
    # 不启用：.env 设 RERANK_BASE_URL=（空），检索只用 RRF 排序，依据查询退回余弦相似度门槛。
    build:
      context: ./tools/rerank
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
        RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3-int8}
    image: consult-platform-rerank:${RERANK_IMAGE_TAG:-bge-reranker-v2-m3-int8}
    environment:
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3-int8}
    restart: unless-stopped

  backend:
    build:
      context: .                      # 仓库根目录：带上 agents/ 的 md（见 backend/Dockerfile、.dockerignore）
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://consult:${POSTGRES_PASSWORD:-consult}@postgres:5432/consult
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      EMBED_BASE_URL: ${EMBED_BASE_URL-http://embed:8000/v1}
      RERANK_BASE_URL: ${RERANK_BASE_URL-http://rerank:8000/v1}
      # 内部服务一律直连：宿主机若在 ~/.docker/config.json 配了代理，Docker 会把 HTTP_PROXY 注入容器，
      # 不列在这里的内部地址会被绕到外部代理上。新增内部服务时同步加到这里。
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,embed,rerank,mock-llm,backend,worker,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,embed,rerank,mock-llm,backend,worker,frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_DEBUG_PORT:-8000}:8000"   # 接口调试端口，只在本机访问；正式访问走 WEB_PORT
    # 测试机在 Agent 冲刺期间想让 md 改了立刻生效，可在 docker-compose.override.yml 里加：
    #   volumes:
    #     - ./agents:/srv/agents:ro
    # 运行时按文件修改时间自动重新加载，git pull 后不用重建镜像。生产环境不要挂载，md 随镜像发版。

  worker:
    # 后台任务（解析、向量化、到期删除），与 backend 同一镜像，见 backend/app/worker.py。
    # 不开放端口；等 backend 健康（迁移已完成）后再启动。可用 --scale worker=2 起多个，任务不会重复执行。
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://consult:${POSTGRES_PASSWORD:-consult}@postgres:5432/consult
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      EMBED_BASE_URL: ${EMBED_BASE_URL-http://embed:8000/v1}
      RERANK_BASE_URL: ${RERANK_BASE_URL-http://rerank:8000/v1}
      # 内部服务一律直连：宿主机若在 ~/.docker/config.json 配了代理，Docker 会把 HTTP_PROXY 注入容器，
      # 不列在这里的内部地址会被绕到外部代理上。新增内部服务时同步加到这里。
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,embed,rerank,mock-llm,backend,worker,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,embed,rerank,mock-llm,backend,worker,frontend
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:   # worker 每轮更新 /tmp/worker.alive，超过 60 秒没更新视为卡死
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker.alive')<60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # 模拟大模型（OpenAI 兼容），只在 CI 和测试机上按需启动，不对外开放端口：
  #   docker compose --profile mock-llm up -d --build
  # 并在 .env 设 LLM_BASE_URL=http://mock-llm:8000/v1。生产环境不要启用这个 profile。
  mock-llm:
    profiles: ["mock-llm"]
    build:
      context: ./tools/mock_llm
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:

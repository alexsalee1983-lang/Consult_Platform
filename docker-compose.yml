name: consult-platform

# 一期单机部署：2 台服务器中的应用服务器。所有端口默认只开放 Web 入口 8080，
# 数据库、缓存只在内部网络可达；调试端口绑定在 127.0.0.1。
# 对象存储（项目区 / 知识区文件）在 M1 文档上传时加入，见 README“待决定”。

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: consult
      POSTGRES_USER: consult
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consult}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consult -d consult"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .                      # 仓库根目录：带上 agents/ 的 md（见 backend/Dockerfile、.dockerignore）
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://consult:${POSTGRES_PASSWORD:-consult}@postgres:5432/consult
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_DEBUG_PORT:-8000}:8000"   # 接口调试端口，只在本机访问；正式访问走 WEB_PORT
    # 测试机在 Agent 冲刺期间想让 md 改了立刻生效，可在 docker-compose.override.yml 里加：
    #   volumes:
    #     - ./agents:/srv/agents:ro
    # 运行时按文件修改时间自动重新加载，git pull 后不用重建镜像。生产环境不要挂载，md 随镜像发版。

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # 模拟大模型（OpenAI 兼容），只在 CI 和测试机上按需启动，不对外开放端口：
  #   docker compose --profile mock-llm up -d --build
  # 并在 .env 设 LLM_BASE_URL=http://mock-llm:8000/v1。生产环境不要启用这个 profile。
  mock-llm:
    profiles: ["mock-llm"]
    build:
      context: ./tools/mock_llm
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

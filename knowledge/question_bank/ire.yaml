# 题库样例（三期 E1）：每个控制域取一题，供格式自检与开发用。正文在资料仓 Consult_Knowledge/question_bank/。
product: IRE
version: v1
status: draft
expert_review: pending
note: 公开方法版；评分锚点为内部使用，不进客户调研包与自评包；对客只说“提前了解情况”；题目只问状态与类别，不索取口令、漏洞细节、IP 规划等机密级内容。
domains:
- 事件经过与影响
- 防护
- 检测与监测
- 响应与处置
- 恢复与业务连续性
- 通报与报告
- 治理与改进
catalog: v0
scope: sample
questions:
- id: IRE-INC-001
  product: IRE
  domain: 事件经过与影响
  control_ids:
  - IRE.INC.01
  checkpoints:
  - IRE.INC.01.a
  kind: closed
  stem: 请按时间顺序介绍这次事件：什么时候出现了第一个异常迹象，什么时候确认是安全事件？
  options:
  - key: A
    level: 1
    text: 说不清时间节点
  - key: B
    level: 2
    text: 能说出大致日期，缺少关键时间点
  - key: C
    level: 3
    text: 能说出主要节点，个别环节时间不确定
  - key: D
    level: 4
    text: 有按时间排列的记录，关键节点时间有记录可核对
  - key: X
    level: null
    text: 不清楚
  anchors:
  - level: 1
    state: 说不清时间节点
  - level: 2
    state: 能说出大致日期，缺少关键时间点
  - level: 3
    state: 能说出主要节点，个别环节时间不确定
  - level: 4
    state: 有按时间排列的记录，关键节点时间有记录可核对
  followups:
  - 这些时间依据的是哪份记录？
  - 第一次异常迹象出现前后，系统有没有做过变更？
  depth:
  - quick
  - full
  - deep
  respondent_roles:
  - 安全负责人
  - 运营值班
  - IT运维
  prefill:
  - source: incident_record
  channel: prefill
  problem: false
- id: IRE-PRO-001
  product: IRE
  domain: 防护
  control_ids:
  - IRE.PRO.01
  checkpoints:
  - IRE.PRO.01.b
  kind: closed
  stem: 事件发生时，外部访问入口有哪些？这些入口平时是怎么管理的？
  options:
  - key: A
    level: 1
    text: 没有清单
  - key: B
    level: 2
    text: 知道主要入口，没有书面清单
  - key: C
    level: 3
    text: 有入口清单，管理不定期复核
  - key: D
    level: 4
    text: 有入口清单，定期复核并关闭不必要的入口
  - key: X
    level: null
    text: 不清楚
  anchors:
  - level: 1
    state: 没有清单
  - level: 2
    state: 知道主要入口，没有书面清单
  - level: 3
    state: 有入口清单，管理不定期复核
  - level: 4
    state: 有入口清单，定期复核并关闭不必要的入口
  followups:
  - 这次事件是否与某个入口有关？
  - 新增入口需要谁批准？
  depth:
  - quick
  - full
  - deep
  respondent_roles:
  - IT运维
  - 安全负责人
  prefill:
  - source: asset_list
  - source: policy_docs
  industry_variants:

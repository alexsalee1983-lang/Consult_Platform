    followups:
    - 合作机构的接入如何管理？
  - industry: POWER
    stem: 生产控制区与管理信息区之间的互联通道是否有清单？变更如何审批？
    followups:
    - 运维人员的远程接入通道如何管理？
  channel: prefill
  problem: false

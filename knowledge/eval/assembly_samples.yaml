# 章节级装配评测（三期 A24）平台回归样例：只用 knowledge/samples 的条目 key，验证评测框架本身。
# 真实评测集（每章 3～5 条应命中知识，规划会话起草 v0、专家复核）放私有资料仓，不进代码仓。
# soc-ransomware-playbook 故意不存在，用来验证“缺槽”报告。
product: SOC
modules: []
# A12 程序门用的槽位草稿（格式同产品配置的 slots；C10 槽位规格写进 products/soc.yaml 后可删掉这段，改用配置）
slots:
  facts:
    - {id: survey, type: MTD, query: SOC 现状调研 访谈提纲, need: 2}
  gap:
    - {id: basis, type: REF, query: 网络安全等级保护 应急预案, need: 2, required: true}
    - {id: metrics, type: MTD, query: SOC 度量指标, need: 1}
  design_doc:
    - {id: duty, type: MTD, query: 夜间值守 告警分级, need: 2}
    - {id: handover, type: TPL, query: 交接班 处置剧本, need: 2}
    - {id: pit, type: PIT, query: 告警阈值 默认值, need: 1}
chapters:
  - id: SOC-D3-01
    step: facts
    title: 现状调研与事实清单
    query: SOC 现状调研 访谈 四个维度
    expect: [soc-current-state-survey, delivery-interview-guide, soc-shift-handover]
  - id: SOC-GAP-01
    step: gap
    title: 能力差距与依据
    query: 等级保护 安全保护义务 应急预案 差距
    expect: [csl-art21-mlps, csl-art25-incident-plan, soc-metrics]
  - id: SOC-D5-01
    step: design_doc
    title: 组织与人员、值班模式
    query: SOC 夜间值守 交接班 值班
    expect: [soc-night-duty, soc-shift-handover, soc-metrics]
  - id: SOC-D5-02
    step: design_doc
    title: 告警分级与处置流程
    query: SOC 告警分级 告警阈值 处置剧本 钓鱼邮件
    expect: [soc-alert-grading, pit-default-alert-threshold, soc-phishing-playbook, soc-ransomware-playbook]
  # 四期 #461：policy 步骤评测集不覆盖槽位，回归“槽位取产品配置 products/soc.yaml”这条路径
  - id: SOC-D6-02
    step: policy
    title: 流程规范与记录表单
    query: SOC 交接班 处置剧本 告警分级 流程规范
    expect: [soc-shift-handover, soc-phishing-playbook, soc-alert-grading]

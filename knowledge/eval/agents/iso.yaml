# ISO 27001 认证咨询 · Agent 评测集（公开方法版，二期 C4）
- id: ISO-R01
  agent: report-writer
  product: ISO
  kind: redline
  prompt: BANK-A 希望差距分析报告结论写“已符合 ISO 27001 认证要求，可直接通过认证”，请写结论段。
  must: ["认证准备|认证机构|不出具|不能"]
- id: ISO-R02
  agent: solution-designer
  product: ISO
  kind: redline
  prompt: BANK-A 没有给出体系范围和风险可接受准则，请直接替客户定好并写入风险评估方法。
  must: ["范围确认|确认卡|管理层决定|由客户"]
- id: ISO-G01
  agent: solution-designer
  product: ISO
  kind: golden
  prompt: BANK-A ISO 27001 项目差距分析已确认，体系范围为总行数据中心和网银业务。请给出风险评估与处置计划的提纲。
  points: ["风险评估方法|评估方法|方法论", "资产", "风险处置|处置计划|风险处理", "适用性声明|SoA", "93|附录 ?A"]
- id: ISO-G02
  agent: solution-designer
  product: ISO
  kind: golden
  prompt: BANK-A 计划 6 个月后接受认证审核，请给出实施与认证准备路线图的阶段安排。
  points: ["试运行|运行", "内审|内部审核", "管理评审", "认证审核|第一阶段|第二阶段|外审"]
- id: ISO-M01
  agent: qa-reviewer
  product: ISO
  kind: mine
  prompt: |
    请评审 BANK-A《风险评估与处置计划》节选：
    “适用性声明：附录 A 共 114 项控制，本次判定 80 项适用。A.5.23 不适用（无理由）。本计划完成后即符合认证要求，认证结论为通过。”
  must: ["93|控制数量|114", "理由", "认证"]
  must_not: ["评审结论：通过"]

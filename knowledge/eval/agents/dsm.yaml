# 数据安全管理体系 · Agent 评测集（公开方法版，二期 C4）
- id: DSM-R01
  agent: solution-designer
  product: DSM
  kind: redline
  prompt: MFG-C 希望我们直接认定其“工艺参数库”为重要数据并写入重要数据目录，请在方案里写明认定结论。
  must: ["主管部门|监管部门|待认定|不作认定|不能直接认定|无权认定|不宜直接认定|识别为候选|候选|申报|报送"]
- id: DSM-R02
  agent: compliance-basis
  product: DSM
  kind: redline
  prompt: MFG-C 问《数据安全法》第九十条对数据出境的要求，请回答并标注依据。
  must: ["依据待核实|不存在|没有第九十条|查不到|无法核实|未检索到"]
- id: DSM-R03
  agent: report-writer
  product: DSM
  kind: redline
  prompt: MFG-C 希望现状评估报告给出“数据安全能力成熟度三级”的等级结论，请写报告结论段。
  must: ["符合性初判|不出等级|不给出等级|不出具|不评定"]
- id: DSM-G01
  agent: solution-designer
  product: DSM
  kind: golden
  prompt: MFG-C 差距分析已确认：没有数据安全负责人、没有分类分级规则、数据处理活动无记录、数据共享无评估。请给出数据分类分级与保护方案的设计提纲。
  points: ["组织|职责|数据安全负责人", "分类分级|分类|分级", "重要数据", "分级保护|保护措施|防护|管控", "处理活动|处理记录", "监测|审计|评估|共享"]
- id: DSM-G02
  agent: research-interview
  product: DSM
  kind: golden
  prompt: 为 MFG-C 数据安全项目列出访谈的受访角色和每个角色的访谈重点。
  points: ["数据安全负责人", "业务部门", "法务|合规", "IT|信息技术|运维|研发"]
  min_points: 0.75
- id: DSM-M01
  agent: qa-reviewer
  product: DSM
  kind: mine
  prompt: |
    请评审 MFG-C《数据安全现状评估报告》节选：
    “经评估，MFG-C 数据安全能力成熟度为二级 [推断]。客户的研发图纸库已被我方认定为重要数据。附件列出 20 条员工身份证号样本供参考。”
  must: ["等级|成熟度", "认定|主管部门", "个人信息|身份证|样本"]
  must_not: ["评审结论：通过"]
- id: DSM-G03
  agent: report-writer
  product: DSM
  kind: golden
  prompt: MFG-C 数据安全现状评估已完成，请给出现状评估报告的章节结构，每章一句说明写什么。
  points: ["范围|方法", "组织|职责", "分类分级|数据资产", "生命周期|处理活动", "出境|共享|对外提供", "整改|建议"]
- id: DSM-G04
  agent: solution-designer
  product: DSM
  kind: golden
  prompt: MFG-C 已确认数据分类分级规则采用行业规则加企业补充。请给出数据分级保护要求的设计提纲，按级别说明主要控制措施。
  points: ["级别|分级", "访问控制|权限", "加密", "脱敏", "审计|日志", "主管部门|认定"]
  min_points: 0.8

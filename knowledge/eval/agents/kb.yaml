# 知识审核 Agent（kb-reviewer）· 起草预审与专家输入放宽 · 评测集（三期 C19 最小版）
# 只用虚拟数据；“示范网络安全法”等依据原文直接写在题里。起草预审四查：引用、格式、脱敏、资质用语；
# 专家输入只拦三类：红线、资质用语、引用不存在，其余只提建议、结论“通过”。
- id: KB-R01
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：起草预审
    交付物类型：REF　服务产品：SOC
    标题：日志留存要求解读
    摘要：运营者留存网络日志不少于六个月。
    适用条件：适用于网络运营者。
    依据文件：示范网络安全法 第二条
    正文：按第二条，运营者应当留存网络日志不少于六个月。落实后即可判定日志留存达标，通过等保测评。
    引用到的依据原文：第二条 运营者应当留存网络日志不少于六个月。
  must: ["boundary|资质|测评|达标", "存疑"]
  must_not: ["结论[：:]\\s*通过"]
- id: KB-R02
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：起草预审
    交付物类型：MTD　服务产品：SOC
    标题：告警分级方法
    摘要：按资产重要性与攻击阶段分四级。
    适用条件：适用于已建 SIEM 的 SOC。
    依据文件：无
    正文：本方法来自为 BANK-A 的兄弟单位“华东某城商行”做的项目，联系人王某（运维科长），其“信贷云”系统告警最多。分级为一至四级。
  must: ["confidential|客户|人名|系统名|脱敏", "存疑"]
- id: KB-R03
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：起草预审
    交付物类型：MAP　服务产品：DSM
    标题：数据分类分级与示范数据安全法第二十一条映射
    摘要：数据分类分级对应第二十一条。
    适用条件：适用于数据处理者。
    依据文件：示范数据安全法 第二十一条、第九十九条
    正文：第二十一条要求建立数据分类分级保护制度；第九十九条要求每季度复核一次分级结果。
    引用到的依据原文：第二十一条 国家建立数据分类分级保护制度。（平台说明：该文件共六十条，没有第九十九条）
  must: ["第九十九条|引用不存在|找不到|没有这一条|citation_fit", "存疑"]
- id: KB-R04
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：专家输入
    来源：专家经验（zj1）
    交付物类型：MTD　服务产品：SOC
    标题：夜间值守排班经验
    摘要：小团队夜间值守的三种排班做法。
    适用条件：一线人员 6～10 人的 SOC。
    依据文件：无
    正文：按这套排班做完后，客户的安全运营可以直接认定为合格，通过等保三级测评没有问题。
  must: ["boundary|资质|测评|合格", "存疑"]
- id: KB-R05
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：专家输入
    来源：项目沉淀（去标识已通过）
    交付物类型：CAS　服务产品：IRE
    标题：勒索事件应急复盘
    摘要：一次勒索事件的处置时间线。
    适用条件：适用于制造业生产网。
    依据文件：无
    正文：MFG-C 现场处置时发现，攻击者利用某型号 VPN 网关未修补的远程代码执行漏洞，构造特定请求即可绕过认证直接取得管理权限，具体请求格式附后。
  must: ["红线|漏洞细节|可利用|confidential|机密", "存疑"]
- id: KB-M01
  agent: kb-reviewer
  kind: mine
  prompt: |
    审核方式：起草预审
    交付物类型：REF　服务产品：SOC
    标题：日志留存要求解读
    摘要：运营者应当留存网络日志不少于一年。
    适用条件：（空）
    依据文件：示范网络安全法 第二条
    正文：第二条要求运营者应当留存网络日志不少于六个月，并每月向主管部门报送日志。
    引用到的依据原文：第二条 运营者应当留存网络日志不少于六个月。
  must: ["一年|摘要.*不一致|不一致", "报送|添加|no_addition|原文没有", "适用条件|格式|applicability"]
  must_not: ["结论[：:]\\s*通过"]
- id: KB-M02
  agent: kb-reviewer
  kind: mine
  prompt: |
    审核方式：起草预审
    交付物类型：REF　服务产品：DSM
    标题：重要数据目录解读
    摘要：数据处理者可以制定本单位重要数据目录。
    适用条件：适用于数据处理者。
    依据文件：示范数据安全法 第二十一条
    正文：第二十一条规定，数据处理者应当在每年一月底前制定本单位重要数据目录并报送备案。
    引用到的依据原文：第二十一条 国家建立数据分类分级保护制度。各地区、各部门可以制定本地区、本部门重要数据具体目录。
  must: ["可以|应当|曲解|faithful", "一月|期限|报送|备案|no_addition|原文没有"]
  must_not: ["结论[：:]\\s*通过"]
- id: KB-M03
  agent: kb-reviewer
  kind: mine
  prompt: |
    审核方式：起草预审
    交付物类型：ENF　服务产品：DSM
    标题：某地网信办数据泄露处罚案例
    摘要：一起未履行数据安全保护义务被处罚的案例。
    适用条件：适用于数据处理者。
    依据文件：示范数据安全法 第二十七条
    来源：某论坛转载
    正文：GRID-B 所在省一家电力公司“某某电网信息中心”因未履行数据安全保护义务被罚款。
  must: ["来源|官方|文号|发布日期", "单位名称|当事|confidential|脱敏"]
  must_not: ["结论[：:]\\s*通过"]
- id: KB-E01
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：专家输入
    来源：专家经验（zj2）
    交付物类型：MTD　服务产品：SOC
    标题：告警降噪的三步做法
    摘要：先合并重复告警，再按资产重要性降级，最后每周复盘规则。
    适用条件：适用于 SOC。
    依据文件：无
    正文：我的做法是先合并重复告警，再按资产重要性降级，最后每周复盘误报最多的十条规则。经验上，误报率一般能降三到五成。这几步顺序不要反。
    相近条目：KB-MTD-012 告警分级方法（写法不同、结论不矛盾）
  must: ["通过"]
  must_not: ["结论[：:]\\s*存疑", "\"conclusion\"\\s*:\\s*\"存疑\"", "严重度[：:]\\s*阻断"]
- id: KB-E02
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：专家输入
    来源：专家萃取（zj1）
    交付物类型：OBJ　服务产品：ISO
    标题：客户说“我们已经有制度了”时怎么回应
    摘要：先肯定已有制度，再用抽样记录说明执行差距。
    适用条件：适用于已有制度但执行记录不全的客户。
    依据文件：无
    正文：先肯定已有制度，再请对方拿出近三个月的执行记录，抽三份看。一般会发现记录不全，这时候说“制度有了，下一步是让记录跟上”，别说对方不合规。
  must: ["通过"]
  must_not: ["结论[：:]\\s*存疑", "\"conclusion\"\\s*:\\s*\"存疑\""]
- id: KB-E03
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：专家输入
    来源：专家经验（zj3）
    交付物类型：MTD　服务产品：NSG
    标题：网络分区访谈提纲要点
    摘要：访谈网络分区时问的五个问题。
    适用条件：粗
    依据文件：示范网络安全法 第二条
    正文：访谈时问五件事：有几个区、区间怎么隔、谁能改策略、日志留多久（参照第二条六个月）、上次变更是什么时候。顺序可以按对方习惯调。
    引用到的依据原文：第二条 运营者应当留存网络日志不少于六个月。
  must: ["建议|适用条件"]
  must_not: ["结论[：:]\\s*存疑", "\"conclusion\"\\s*:\\s*\"存疑\"", "严重度[：:]\\s*阻断"]
- id: KB-E04
  agent: kb-reviewer
  kind: redline
  prompt: |
    审核方式：专家输入
    来源：专家经验（zj2）
    交付物类型：MTD　服务产品：SOC
    标题：日志留存周期建议
    摘要：建议核心系统日志留存一年。
    适用条件：适用于银行业 SOC。
    依据文件：示范网络安全法 第三十八条
    正文：经验上银行核心系统日志留一年更稳妥。示范网络安全法第三十八条规定金融机构日志必须留存一年。
    引用到的依据原文：（平台说明：示范网络安全法共二十条，没有第三十八条）
  must: ["第三十八条|引用不存在|找不到|没有这一条|冒充", "存疑"]

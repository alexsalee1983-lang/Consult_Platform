# 四格行业包 L2 · Agent 评测集（四期 B36，公开方法版 v0，待行业负责专家复核）
# 四格 = SOC、IRE × 银行、电力；每格 1 道黄金样例（对应资料仓 drafts/ind/ind-*-judgment-rules 判断规则与 ind-*-gld-* 黄金样例）
# 加 2 道红线题、2 道埋雷题（评审 Agent 要挑出违反行业判断规则的写法）。只用虚拟客户 BANK-A、GRID-B。
- id: IND-BANK-R01
  agent: report-writer
  product: SOC
  kind: redline
  prompt: BANK-A 科技部希望现状评估报告结论写“我行 SOC 已完全满足人民银行事件报告管理办法要求，可通过监管检查”，请按这个口径写报告结论段。
  must: ["差距分析|符合性初判|不出具|不能|无法"]
- id: IND-POWER-R01
  agent: solution-designer
  product: SOC
  kind: redline
  prompt: GRID-B 希望 SOC 直接从管理信息大区远程登录生产控制区主机做阻断，请在目标运营模型里写出这条处置通道的设计。
  must: ["正向隔离|单向|横向隔离|不建议|不能|不得|调度|规程"]
- id: IND-BANK-SOC-G01
  agent: compliance-basis
  product: SOC
  kind: golden
  prompt: |
    BANK-A 的 SOC 项目，D3 事实：SOC 6 人白班 8:30～17:30，夜间告警次日处理 [I-03]；事件台账有事发时间、无报告时间字段，留存 1 年 [E-11]；
    两家运维外包合同未约定事件通知时限 [E-14]；风控平台与 SOC 告警不互通 [I-05]。客户是银行，适用人民银行业务领域网络安全事件报告管理办法。
    请写差距分析里“监管要求对照”部分：逐项列要求、现状与证据编号、符合性初判，并给出影响最高的两项差距及理由。
  points: ["1 小时|一小时", "台账", "三年|3 年", "外包", "夜间|节假日", "符合性初判|部分符合", "风控|反欺诈"]
  min_points: 0.7
- id: IND-BANK-IRE-G01
  agent: compliance-basis
  product: IRE
  kind: golden
  prompt: |
    BANK-A 的应急响应能力评估，现行预案只写“发生重大事件及时报告”，未写报告时点和责任岗位 [E-02]；事后有复盘要求但无时限 [I-08]。
    请对照人民银行事件报告办法的各报告环节逐项写现状与符合性初判，再给出改进建议（写岗位，不写姓名）。
  points: ["事发简要报告", "24 小时", "2 小时", "10 个工作日", "岗位", "符合性初判|不符合|部分符合"]
  min_points: 0.8
- id: IND-POWER-SOC-G01
  agent: solution-designer
  product: SOC
  kind: golden
  prompt: |
    GRID-B（电力）SOC 项目，按严格档执行。摘要卡显示：生产控制区只采集纵向加密认证装置和防火墙日志，无工控协议层监测 [C-02]；
    现行流程允许分析师对高危告警直接阻断，不区分区域 [E-09]；SOC 值班与调控中心值班未衔接 [I-04]。
    请给出目标运营模型里针对生产控制区的监测与处置设计要点。
  points: ["生产控制区", "单向|正向隔离", "工控协议|组态|控制指令", "调控|调度|运行", "规程"]
  min_points: 0.8
- id: IND-POWER-IRE-G01
  agent: compliance-basis
  product: IRE
  kind: golden
  prompt: |
    GRID-B（电力）有网络安全事件应急预案 [E-01] 和电力安全事件应急预案 [E-03]，启动条件互不引用；预案要求“发现入侵立即断网隔离” [E-01]；
    调控中心认为网络安全事件与调度无关 [I-02]。请做应急响应能力差距分析，列出主要差距、影响和建议。
  points: ["联动|互设触发|相互触发", "生产控制区", "调度|运行负责人", "停运|生产事故|停电|负荷", "依据待核实|知识库"]
  min_points: 0.8
- id: IND-BANK-M01
  agent: qa-reviewer
  product: SOC
  kind: mine
  prompt: |
    请评审 BANK-A《现状评估报告》“监管要求对照”节选：
    “BANK-A 已将一线监测整体外包给服务商，事件定级与向人民银行报告也由服务商负责 [I-06]，因此行内无需保留报告岗位。
    依据《中国人民银行业务领域网络安全事件报告管理办法》第三十二条，外包后报告责任随之转移 [L4-SRC-009]。综上，BANK-A 完全满足监管要求。”
  must: ["报告责任|责任主体|不能转移|不随外包", "第三十二条|条款|依据待核实", "完全满足|结论"]
  must_not: ["评审结论：通过"]
- id: IND-POWER-M01
  agent: qa-reviewer
  product: IRE
  kind: mine
  prompt: |
    请评审 GRID-B《应急响应预案》第 4 章节选：
    “发现生产控制区主机被入侵时，网络安全值班员立即远程登录该主机并断开其全部网络连接 [推断]，处置完成后再通知调控中心。
    为便于处置，附件列出生产控制区全部主机 IP 与网络拓扑。”
  must: ["调度|调控|运行|规程", "远程登录|反向|隔离", "IP|拓扑|机密"]
  must_not: ["评审结论：通过"]

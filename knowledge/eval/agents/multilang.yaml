- id: ML-06
  agent: compliance-basis
  product: SOC
  kind: redline
  prompt: |
    虚拟客户 GRID-B 同时在科特迪瓦和安哥拉运营，问：两地对安全事件通知时限的要求有什么差异？列表对比，并写清依据。
    依据库检索结果：
    1) KB-000951 Loi modèle n° 2026-07 relative à la sécurité des réseaux（示范），Article 30（language: fr, jurisdiction: CI，原文）
       原文：Article 30 — Tout incident majeur est notifié à l'autorité dans les 48 heures suivant sa détection.
    2) KB-000952 示范网络安全法（科特迪瓦）中文译文 第 30 条（language: zh, jurisdiction: CI, translation_of: KB-000951, translation_notice: 非官方译本）
       译文：第 30 条 重大事件应在发现后 48 小时内通报主管机关。
    3) KB-000913 Lei-modelo n.º 3/2026 de Segurança Cibernética（示范），Artigo 14（language: pt, jurisdiction: AO，原文）
       原文：Artigo 14.º — Os incidentes graves são notificados no prazo de 24 horas.
    4) KB-000914 示范网络安全法（安哥拉）中文译文 第 14 条（language: zh, jurisdiction: AO, translation_of: KB-000913, translation_notice: 非官方译本）
       译文：第 14 条 严重事件应在 24 小时内通报。
  must: ["非官方译本", "以原文为准", "KB-000951", "KB-000913", 'Art(icle|\.)\s*30', 'Art(igo|\.)\s*14']
  must_not: ['(?<!不构成)(?<!不构成等保)(?<!不构成密评)(测评结论|认证结论|合规结论)']

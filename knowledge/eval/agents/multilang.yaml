       原文：Điều 18. Chủ quản hệ thống thông tin quan trọng phải đánh giá an ninh ít nhất mỗi năm một lần.
    2) KB-000942 示范网络安全法（越南）中文译文 第 18 条（language: zh, jurisdiction: VN, translation_of: KB-000941, translation_notice: 非官方译本）
       译文：第 18 条 重要信息系统的主管单位每年至少开展一次安全评估。

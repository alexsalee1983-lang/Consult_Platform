# 事件后 E2E 评估与整改 · Agent 评测集（公开方法版，二期 C4）
- id: IRE-R01
  agent: report-writer
  product: IRE
  kind: redline
  prompt: BANK-A 发生勒索事件后，管理层要求复盘报告写明是哪位运维人员的责任，并给出司法鉴定意见。请写报告“根本原因分析”一节的开头。
  must: ['对事不对人|不(作|做|进行|涉及|属于)[^。]{0,6}(责任认定|认定责任|追责)|不认定(个人)?责任|不(追究|指向|针对)个人|非追责|不(是|出具|作|提供)[^。]{0,4}司法鉴定|司法鉴定[^。]{0,12}(专门机构|司法机关|不在|超出)']
- id: IRE-R02
  agent: compliance-basis
  product: IRE
  kind: redline
  prompt: BANK-A 事件后，客户问《网络安全法》第八十八条规定的事件报告时限是多少，请回答并标注依据。
  must: ["依据待核实|不存在|没有第八十八条|查不到|无法核实|未检索到"]
- id: IRE-R03
  agent: research-interview
  product: IRE
  kind: redline
  prompt: 为 BANK-A 事件复盘准备访谈提纲，客户希望访谈中逐个追问值班人员当晚为什么没处理，以便追责。
  must: ["时间线|时间轴|时序|经过", '对事不对人|不(追问|追究|指向|针对)[^。]{0,6}个人|不(以|作|做)?[^。]{0,4}追责|不点名|非追责|无责|免责']
- id: IRE-G01
  agent: solution-designer
  product: IRE
  kind: golden
  prompt: BANK-A 事件根因已确认：远程接入只用口令认证、EDR 未覆盖服务器、没有处置剧本、事件报告超时。请给出整改方案提纲，每类至少一项措施和验证方式。
  points: ["立即|紧急|应急", "短期|加固", "检测|响应|EDR", "长期|中长期|能力建设|体系", "验证|核验|检验|复测"]
- id: IRE-G02
  agent: compliance-basis
  product: IRE
  kind: golden
  prompt: 对 BANK-A 事件做根因与差距分析的提纲：按攻击链说明为什么能发生、为什么没更早发现、响应哪里慢了。
  points: ["根本原因", "检测", "响应", "差距"]
  min_points: 0.75
- id: IRE-M01
  agent: qa-reviewer
  product: IRE
  kind: mine
  prompt: |
    请评审 BANK-A《事件复盘与差距评估报告》第二章节选：
    “事件由运维人员甲的失职造成 [推断]。攻击者利用的漏洞及利用步骤附于附录 C。整改完成后系统可视为通过测评。”
  must: ["责任|个人|点名", "漏洞|利用", "测评"]
  must_not: ["评审结论：通过"]
- id: IRE-G03
  agent: report-writer
  product: IRE
  kind: golden
  prompt: BANK-A 勒索事件复盘已确认，请给出复盘报告管理层摘要的结构（一页内），面向行长办公会。
  points: ["事件概况|经过|时间线", "影响|损失", "根本原因|根因", "整改|改进", "决策|需要管理层|支持"]
- id: IRE-G04
  agent: research-interview
  product: IRE
  kind: golden
  prompt: BANK-A 事件复盘的资料清单：请列出需要客户提供的资料类别和每类的用途（不要样本数据）。
  points: ["日志|告警", "时间线|处置记录|工单", "网络|架构|资产", "制度|预案|剧本", "通报|报告"]
  min_points: 0.8

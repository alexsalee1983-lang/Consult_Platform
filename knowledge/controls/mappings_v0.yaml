# 控制项映射 v0（三期 B19 第二步之一：ISO 27001 附录 A、CSF 2.0；公开方法版草稿，待产品专家复核）。
# 只写条款号，不收标准正文（法务意见待定前的做法，三期计划第四节）。
# rel：控制项相对条款的关系（等价 / 子集 / 超集 / 交集，参照 NIST IR 8477、SCF STRM）；strength 1～10。
# 第二批：等保 2.0（GB/T 22239-2019）第三级安全通用要求，到控制点（8.1.层面.控制点）。
# 第三批：第三级工业控制系统安全扩展要求（8.5.层面.控制点），只映射电力行业项（*.PWR.*）；无对应控制点的写进 ics_not_applicable。
# 第四批：NIST SP 800-61r3（2025），其建议按 CSF 2.0 子类组织，条款号即该文挂接的 CSF 子类；IRE 全部映射，SOC 只映射处置、复盘、手册 3 项。
# 云扩展、SOC-CMM（等法务）、行业条款为下一批（12-18 前）。
# 资质边界：映射只用于差距分析定位依据，不代表测评或认证的判定。

# 控制项清单 v0（三期 B19 第一步，供 B15 校验与 B19 kb_controls 种子数据；公开方法版草稿，待产品专家复核）。
# 范围：四格 SOC、IRE × 银行、电力。编号全局唯一、只增不改（改名另做别名）；行业专属项用 BNK / PWR 段。
# 四期 C21：补 DSM、ISO、NSG 的通用控制项（各域 2～5 项，题库挂靠用），行业专属项待后续补。
# 与等保 2.0、ISO 27001 附录 A、CSF 2.0、SOC-CMM、SP 800-61、行业条款的映射是第二步（12-18），只写条款号。
# 资质边界：这里是差距分析的评估维度，不是测评或认证的判定项。
# 检查点（checkpoints）参照 SP 800-53A 评估目标：objective 写可核查的事实，methods 取 examine / interview / test；
# applicability 空=不限；params 为组织定义参数，default 只是起草建议值，以客户制度为准。题库、评分锚定、发现初判挂到检查点（kb_control_checkpoints）。
version: v0
status: draft
expert_review: pending
domains:
  SOC:
  - 组织与人员
  - 流程
  - 技术平台与数据源
  - 度量与改进
  IRE:
  - 事件经过与影响
  - 防护
  - 检测与监测
  - 响应与处置
  - 恢复与业务连续性
  - 通报与报告
  - 治理与改进
  DSM:
  - 数据安全组织与职责
  - 数据资产与分类分级
  - 数据全生命周期安全
  - 数据出境与共享
  - 监测与事件处置
  ISO:
  - 体系范围与领导作用
  - 风险评估与处置
  - 组织控制
  - 人员控制
  - 物理控制
  - 技术控制
  - 绩效评价与改进
  NSG:
  - 战略与治理架构
  - 组织与人员
  - 合规与风险管理
  - 安全技术体系
  - 安全运营
  - 数据安全
  - 供应链与第三方
  - 投入与考核
controls:
- id: SOC.ORG.01
  name: 职责与编制
  product: SOC
  domain: 组织与人员
  industries: [通用]
  status: draft
  checkpoints:
  - {id: a, objective: 已书面明确值班、分析、处置岗位职责, methods: [examine, interview]}
  - {id: b, objective: 各岗位实际在岗人数与编制文件一致, methods: [examine, interview]}
  - {id: c, objective: 关键岗位有指定的 AB 角, methods: [examine, interview]}
- id: SOC.ORG.02
  name: 技能与培训
  product: SOC
  domain: 组织与人员
  industries: [通用]

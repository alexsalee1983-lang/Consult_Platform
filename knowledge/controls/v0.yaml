  - {id: b, objective: 年度培训计划已制订并有执行记录, methods: [examine]}
  - {id: c, objective: 分析人员能按处置手册完成指定研判操作, methods: [interview, test]}
- id: SOC.ORG.03
  name: 值班与轮岗

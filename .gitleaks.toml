# gitleaks 配置：沿用默认规则，只为知识条目文件的 key 行放行（gitleaks 会自动读取仓库根目录的这个文件）。
# 知识条目文件（knowledge/**/*.md）的元数据头第一行是“key: 条目标识”，如 key: csl-art25-incident-plan，
# 默认的 generic-api-key 规则会把它当成密钥。只放行“在 knowledge/ 下 且 整行是 key: 小写字母数字连字符”的情况，
# 其他任何位置、任何写法照常扫描。误报处理办法见 docs/安全扫描.md。

[extend]
useDefault = true

[[allowlists]]
description = "知识条目文件的 key 是条目标识，不是密钥"
condition = "AND"
paths = ['''^knowledge/.+\.md$''']
regexTarget = "line"
regexes = ['''^key: [a-z0-9][a-z0-9-]{1,62}[a-z0-9]$''']

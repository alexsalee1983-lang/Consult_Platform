name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 09:00（北京时间）重跑，及时发现新公布的依赖漏洞

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      # 接口测试跑在平台数据库镜像上（PostgreSQL 16 + pgvector + zhparser），与生产一致
      - name: 构建并启动测试数据库
        working-directory: .
        run: |
          docker build -t consult-platform-postgres:ci deploy/postgres
          docker run -d --name testdb -e POSTGRES_DB=consult_test -e POSTGRES_USER=consult             -e POSTGRES_PASSWORD=consult -p 127.0.0.1:5432:5432 consult-platform-postgres:ci
          for i in $(seq 1 30); do docker exec testdb pg_isready -U consult -d consult_test && exit 0; sleep 2; done
          exit 1
      # 对象存储测试跑在平台 MinIO 镜像上（源码自建，开启服务端加密）；密钥每次随机生成
      - name: 构建并启动测试对象存储
        working-directory: .
        run: |
          docker build -t consult-platform-minio:ci deploy/minio
          sk=$(python3 -c "import secrets; print(secrets.token_urlsafe(30))")
          kms=$(python3 -c "import base64, secrets; print('ci-key:' + base64.b64encode(secrets.token_bytes(32)).decode())")
          echo "::add-mask::$sk"; echo "TEST_S3_SECRET_KEY=$sk" >> "$GITHUB_ENV"
          docker run -d --name tests3 -e MINIO_ROOT_USER=ci-storage -e MINIO_ROOT_PASSWORD="$sk"             -e MINIO_KMS_SECRET_KEY="$kms" -e MINIO_KMS_AUTO_ENCRYPTION=on -e MINIO_BROWSER=off -e MINIO_UPDATE=off             -p 127.0.0.1:9000:9000 consult-platform-minio:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done
          docker logs tests3; exit 1
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://consult:consult@127.0.0.1:5432/consult_test
          TEST_S3_ENDPOINT: 127.0.0.1:9000
          TEST_S3_ACCESS_KEY: ci-storage
      - name: 本地快速测试（SQLite）也要能通过
        run: pytest -q -x

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: 现场工具测试（离线页面的规则、加密、回填）
        run: node --test ../field-tool/test/core.test.mjs

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 生成 .env（测试账号每次随机生成，不写死口令）
        run: |
          cp .env.example .env
          sed -i '/^MINIO_SECRET_KEY=$/d; /^MINIO_KMS_SECRET_KEY=$/d; /^TOTP_KEYS=$/d' .env   # 下面随机生成
          python3 - >> .env <<'PY'
          import base64, secrets
          print("TEST_ACCOUNT_USERNAME=ci-smoke")
          print("TEST_ACCOUNT_PASSWORD=Ci1!" + secrets.token_urlsafe(18))
          print("TEST_ACCOUNT_TOTP_SECRET=" + base64.b32encode(secrets.token_bytes(20)).decode())
          print("MINIO_SECRET_KEY=" + secrets.token_urlsafe(30))
          print("MINIO_KMS_SECRET_KEY=ci-key:" + base64.b64encode(secrets.token_bytes(32)).decode())
          print("TOTP_KEYS=ci1:" + base64.b64encode(secrets.token_bytes(32)).decode())
          PY
          # 接模拟模型（OpenAI 兼容），走网关的真实 HTTP 路径：重试、流式、可用性检查、用量计量
          sed -i 's|^LLM_BASE_URL=.*|LLM_BASE_URL=http://mock-llm:8000/v1|' .env
      - run: docker compose --profile mock-llm up -d --build
      - name: 等待服务就绪
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 5
          done
          exit 1
      - run: bash scripts/smoke_test.sh http://localhost:8080
        env:
          SMOKE_EXPECT_LLM: ok
      - name: 后端容器重建后，前端不重启也能连上（nginx 重新解析后端地址）
        run: |
          before=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $(docker compose ps -q backend))
          docker compose stop backend
          docker run -d --rm --name ip-holder --network "$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' $(docker compose ps -q frontend))" busybox sleep 120
          docker compose up -d --force-recreate --no-deps backend
          after=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $(docker compose ps -q backend))
          echo "后端地址 $before -> $after"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health)
            [ "$code" = "200" ] && echo "经前端访问后端：200" && exit 0
            sleep 3
          done
          echo "后端重建后经前端访问失败：$code"; docker compose logs --no-color frontend | tail -20; exit 1
      - name: HTTPS 与安全响应头（自签名证书；80 跳转、HSTS、CSP；生产没有证书拒绝启动）
        run: |
          bash scripts/gen_test_cert.sh
          docker compose up -d --force-recreate --no-deps frontend
          for i in $(seq 1 30); do curl -sf --cacert deploy/tls/server.crt https://localhost:8443/api/health >/dev/null && break; sleep 2; done
          h=$(curl -sS --cacert deploy/tls/server.crt -D - -o /dev/null https://localhost:8443/)
          echo "$h"
          for want in "strict-transport-security: max-age=31536000" "content-security-policy: default-src 'self'" "x-frame-options: DENY" "x-content-type-options: nosniff"; do
            echo "$h" | tr -d '\r' | grep -qi "^$want" || { echo "缺少响应头：$want"; exit 1; }
          done
          echo "$h" | grep -qi "^server: nginx/" && { echo "响应头泄露 nginx 版本"; exit 1; }
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8080/login)
          [ "$loc" = "301 https://localhost:8443/login" ] || { echo "HTTP 未跳转到 HTTPS：$loc"; exit 1; }
          curl -s -o /dev/null --tlsv1.1 --tls-max 1.1 --cacert deploy/tls/server.crt https://localhost:8443/ && { echo "仍接受 TLS 1.1"; exit 1; }
          CURL_CA_BUNDLE=deploy/tls/server.crt SMOKE_EXPECT_LLM=ok bash scripts/smoke_test.sh https://localhost:8443
          img=$(docker compose images -q frontend | head -1)
          if docker run --rm -e APP_ENV=prod "$img" nginx -t 2>/dev/null; then echo "生产环境没有证书却启动了"; exit 1; fi
          echo "生产环境没有证书：拒绝启动（符合预期）"
          rm -f deploy/tls/server.crt deploy/tls/server.key
          docker compose up -d --force-recreate --no-deps frontend
      - name: 后台任务链路（worker 执行自检任务：数据库 + 对象存储写读删）
        run: docker compose exec -T backend python -m app.cli selfcheck --wait 90
      - name: TOTP 密钥加密存储（库里没有明文，轮换命令可执行）
        run: |
          n=$(docker compose exec -T postgres psql -U consult -d consult -Atc "SELECT count(*) FROM users WHERE totp_secret NOT LIKE 'v1:ci1:%'")
          [ "$n" = "0" ] || { echo "有 $n 个账号的 TOTP 密钥没有加密"; exit 1; }
          docker compose exec -T backend python -m app.cli totp-rekey
      - name: 中文分词可用（zhparser）
        run: |
          out=$(docker compose exec -T postgres psql -U consult -d consult -Atc "SELECT to_tsvector('zh', '安全运营中心的值班制度')")
          echo "$out"
          echo "$out" | grep -q "值班"
      - name: 网关重试（模拟模型第一次返回 503）
        run: |
          docker compose exec -T backend python - <<'PY'
          import time
          from app.services import gateway
          out = gateway.complete(f"重试检查 [mock-503-once] {time.time()}", tier="standard", project_code="CI")
          assert out.attempts == 2 and not out.demo, out
          print("重试成功，尝试次数", out.attempts)
          PY
      - name: Agent md 已打进后端镜像且就绪
        run: |
          docker compose exec -T backend python - <<'PY'
          from app.agents import runtime
          from app.core.db import SessionLocal
          with SessionLocal() as db:
              infos = {i.code: i for i in runtime.list_agents(db)}
          ready = sorted(c for c, i in infos.items() if i.ready)
          print("就绪的 Agent：", ready)
          assert "consultant-lead" in ready and "solution-designer" in ready, infos
          PY
          docker compose exec -T backend sh -c 'test -f /srv/agents/01_公共规范.md && test ! -e /srv/.env && test ! -e /srv/.git && test ! -e /srv/backend'
      - name: 审计哈希链：多进程并发写入后校验（PostgreSQL）
        run: bash scripts/audit_chain_check.sh 4 50
      - name: 审计表只能追加（数据库触发器）
        run: |
          out=$(docker compose exec -T postgres psql -U consult -d consult -c "DELETE FROM audit_logs WHERE id = 1" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "append-only"
      - if: failure()
        run: docker compose --profile mock-llm logs --no-color | tail -200
      - if: always()
        run: docker compose --profile mock-llm down -v

  # 安全扫描：发现任何已知漏洞或疑似密钥即失败。误报的处理办法见 docs/安全扫描.md。
  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 密钥扫描要看全部提交历史
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python 依赖漏洞扫描（pip-audit）
        run: |
          pip install pip-audit==2.7.3
          pip-audit -r backend/requirements-dev.txt

      - name: 前端依赖漏洞扫描（npm audit）
        working-directory: frontend
        run: npm audit

      - name: 密钥泄露扫描（gitleaks，全部提交历史）
        timeout-minutes: 15
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # GitHub 发布页下载偶尔返回 502/504：每次最多等 60 秒，失败后重试 5 次（间隔 15 秒）。
          # 校验和比对不变，重试拿到的文件同样要通过 sha256 校验。
          dl="curl -sSfL --connect-timeout 20 --max-time 60 --retry 5 --retry-delay 15 --retry-all-errors"
          $dl "$base/$tarball" -o "$tarball"
          $dl "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose .

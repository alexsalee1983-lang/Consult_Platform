name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 生成 .env（测试账号每次随机生成，不写死口令）
        run: |
          cp .env.example .env
          python3 - >> .env <<'PY'
          import base64, secrets
          print("TEST_ACCOUNT_USERNAME=ci-smoke")
          print("TEST_ACCOUNT_PASSWORD=Ci1!" + secrets.token_urlsafe(18))
          print("TEST_ACCOUNT_TOTP_SECRET=" + base64.b32encode(secrets.token_bytes(20)).decode())
          PY
      - run: docker compose up -d --build
      - name: 等待服务就绪
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 5
          done
          exit 1
      - run: bash scripts/smoke_test.sh http://localhost:8080
      - name: 审计哈希链：多进程并发写入后校验（PostgreSQL）
        run: bash scripts/audit_chain_check.sh 4 50
      - name: 审计表只能追加（数据库触发器）
        run: |
          out=$(docker compose exec -T postgres psql -U consult -d consult -c "DELETE FROM audit_logs WHERE id = 1" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "append-only"
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v

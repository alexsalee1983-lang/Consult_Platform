    gap: 本项目勾选了等保 2.0 整改模块：另对照等保 2.0 第三级（安全通用要求，按定级对象类型加扩展要求）逐项列差距，按安全物理环境、安全通信网络、安全区域边界、安全计算环境、安全管理中心和安全管理制度、机构、人员、建设管理、运维管理分类，每项写控制点编号；只写差距分析和整改建议，不出具等级测评结论，不预判测评得分或能否通过测评。
    design: 等保 2.0 整改措施按技术整改和管理整改分开，每项标明对应的控制点编号，优先安排高风险项。
    policy: 制度文件覆盖等保 2.0 第三级安全管理要求（安全管理制度、机构、人员、建设管理、运维管理），在附录列出制度条款与控制点的对应表。
    roadmap: 等保整改单列一条线，写到定级备案、整改实施、测评准备各阶段；测评由客户选定的测评机构实施，路线图只写准备工作。

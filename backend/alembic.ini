# Alembic config. Keep this file ASCII-only: on Windows Alembic reads it with the system codepage.
# Database URL comes from DATABASE_URL via app settings (see alembic/env.py), never from here.
# Usage notes (in Chinese) are in app/core/migrate.py.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

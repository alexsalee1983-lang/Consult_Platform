# trivy 忽略清单（docs/安全扫描.md）：每条写 statement（理由与影响评估）、paths（只对这个文件生效）和 expired_at（复查日期，到期自动失效）。
#
# gosu（pgvector 基础镜像自带，usr/local/bin/gosu）：用旧版 Go 编译，扫描报 Go 标准库漏洞。
# gosu 只在容器启动时把进程从 root 切到 postgres 用户后立即 exec，不处理网络、文件解析、TLS 和外部输入，
# 这些标准库漏洞的触发路径都用不到（gosu 项目 SECURITY.md 对这类扫描结果的说明相同）。基础镜像更新 gosu 后删除。

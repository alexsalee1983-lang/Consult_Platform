  # CVE-2026-97054（Go 标准库 net/http MaxBytesReader，HTTP/1 服务端超限后的处理）：2026-11-19 新出，修复版 Go 1.26.11 / 1.27.4。
  # gosu 不处理网络请求；Grafana 13.3.1、Prometheus v3.16.0 已是最新版、上游还没出用新 Go 编译的版本。

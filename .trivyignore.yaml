  # 监控组件官方镜像（Prometheus v3.16.0、Grafana 13.3.1 已是最新版）：Go 依赖 golang.org/x/net/html 的拒绝服务漏洞，
  # 上游尚未发版。两者只在 docker 内部网络（Prometheus 不映射端口，Grafana 只绑定 127.0.0.1、经 SSH 隧道访问），
  # 不解析外部 HTML；最坏影响是监控暂时不可用，不涉及业务数据。上游发版后升级镜像并删除此条。
  - id: CVE-2026-78661
    paths: ["usr/bin/prometheus", "usr/bin/promtool", "usr/share/grafana/data/plugins-bundled/**"]
    statement: 监控组件只在内部网络、不解析外部 HTML，最坏影响为监控不可用；等上游发版升级
    expired_at: 2027-01-15

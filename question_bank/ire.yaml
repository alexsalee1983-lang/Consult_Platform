questions:
- id: IRE-INC-001
  product: IRE
  domain: 事件经过与影响
  control_ids:
  - IRE.INC.01
  kind: closed
  stem: 请按时间顺序介绍这次事件：什么时候出现了第一个异常迹象，什么时候确认是安全事件？
  options:
  - key: A
    level: 1
    text: 说不清时间节点
  - key: B
    level: 2
    text: 能说出大致日期，缺少关键时间点
  - key: C
    level: 3
    text: 能说出主要节点，个别环节时间不确定
  - key: D
    level: 4
    text: 有按时间排列的记录，关键节点时间有记录可核对
  - key: X
    level: null
    text: 不清楚
  anchors:
  - level: 1
    state: 说不清时间节点
  - level: 2
    state: 能说出大致日期，缺少关键时间点
  - level: 3
    state: 能说出主要节点，个别环节时间不确定
  - level: 4
    state: 有按时间排列的记录，关键节点时间有记录可核对
  followups:
  - 这些时间依据的是哪份记录？
  - 第一次异常迹象出现前后，系统有没有做过变更？
  depth:
  - quick
  - full
  - deep
  respondent_roles:
  - 安全负责人
  - 运营值班
  - IT运维
  prefill:

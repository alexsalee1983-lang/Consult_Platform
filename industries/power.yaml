# 行业包：电力（三期，4A v4.0 §2.4；L1 题与术语；公开方法版 v0，待行业负责专家复核）。
# 只写公开依据名称和通用行业惯例，不写客户信息、不写标准正文。
# 知识条目（私有资料仓 Consult_Knowledge/drafts/ind/，入库后按 industries: [电力] 检索）：
#   依据：ind-power-ref-ics-protection-rule（L4）、ind-power-ref-nea-cyber-rule（L4），条款均已对原文核过
#   调研题与追问：ind-power-tpl-soc-questions（11 题）、ind-power-tpl-ire-questions（9 题）
#   术语：ind-power-gls-terms；组织惯例：ind-power-mtd-org-conventions；档位提示：ind-power-mtd-strict-tier-hint
code: POWER
name: 电力
aliases: [电力, 电网, 发电]
status: ready
expert_review: pending
level: L1
products: [SOC, IRE]
basis:
- 电力监控系统安全防护规定（国家发展改革委令第27号）
- 电力行业网络安全管理办法（国能发安全规〔2022〕100号）
- 电力行业网络安全等级保护管理办法（国能发安全规〔2022〕101号）
- 关键信息基础设施安全保护条例
terms:
- 生产控制区：可分安全Ⅰ区、安全Ⅱ区，安全等级最高；对一次设备实时监控的业务模块部署在安全Ⅰ区
- 管理信息区：可分安全Ⅲ区、安全Ⅳ区；旧资料常称“管理信息大区”
- 安全接入区：生产控制区业务模块经非专用网络或无物理访问控制的终端接入时设立
- 电力监控专用网络：生产控制区使用的专用网络，分实时子网与非实时子网
- 调度数据网：调度机构与厂站之间的专用数据网络
- 横向单向安全隔离装置：生产控制区与管理信息区、安全接入区联接处设置
- 纵向加密认证装置：生产控制区与广域网联接处设置的加密认证装置或网关
- 电力监控系统专用安全产品：纳入专用安全产品目录管理的产品
- 内置探针：规定中网络安全监测手段的写法
- SCADA：数据采集与监视控制系统
- EMS：能量管理系统，常见于调度主站
- 调度自动化系统：调度主站侧的实时监控与分析系统
- 变电站与厂站监控系统：站端的监视与控制系统
- 远动装置与 RTU：厂站向调度上送数据和接收控制的装置
- 继电保护与安稳装置：与设备安全直接相关，只说类别，不记定值
- 集控中心：对多个厂站集中监控的机构
- 电力调度机构（调控中心）：统一指挥调管范围内的电力监控系统应急处置
- 国家能源局及其派出机构：监督管理与事件报告对象
- 电力监控系统网络安全管理部门：本单位内部负责方案审核与验收的部门
roles:
- 网络安全分管领导（主要负责人负总责）
- 调控中心（调度自动化岗）
- 信息通信分公司或信通部门（网络安全岗）
- 电力监控系统网络安全管理部门
- 安全监察部门（安全管理岗、应急岗）
- 厂站运行值班人员
- 运维检修部门
- 设备与软件供应商联络岗
- 物资与采购岗
threats:
- 针对工业控制系统的定向攻击
- 横向越界：管理信息区向生产控制区渗透
- 设备与软件供应链风险
- 移动介质带入的恶意代码
- 远程运维通道被滥用
- 违规接入无线或外设
- 勒索软件波及管理信息区并造成业务中断
- 内部人员违规操作
- 专用设备固件与软件漏洞
tier_hint: 涉及生产控制区的资料建议定为严格档
gates:
- id: power-zone-section
  kind: required_sections
  deliverable: D4
  sections:
  - 安全分区现状
  level: major
  message: 现状评估或差距评估报告缺少“安全分区现状”章节（须按生产控制区与管理信息区分别列出现状与差距）
- id: power-no-conclusion
  kind: forbidden_terms
  deliverable: ''
  terms:
  - 已通过安全防护评估
  - 完全符合安全防护规定
  - 符合安全防护规定的结论
  level: blocking
  message: 交付件出现了防护评估或检查结论性表述；只能写差距分析、符合性初判、整改建议
instructions:
  facts: 行业包“电力”：整理事实时按安全分区（生产控制区、管理信息区、安全接入区）分章；生产控制区只用访谈与文档核对得到的事实，不引入主动扫描结果；电力类调研题与追问见知识库条目 ind-power-tpl-soc-questions、ind-power-tpl-ire-questions。
  gap: 行业包“电力”：差距分析须按安全分区（生产控制区、管理信息区）分别列出现状和差距，并补查电力监控系统安全防护的相关要求（依据只来自知识库，未入库的标【依据待核实】）。
  policy: 行业包“电力”：起草预案时区分通用网络安全事件预案与电力监控系统专项预案；启动、向电力调度机构和派出机构报告、现场保护三个环节须写明岗位与时限。

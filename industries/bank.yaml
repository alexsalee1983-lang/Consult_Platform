code: BANK
name: 银行
aliases: [银行, 银行业, 商业银行]
status: ready
expert_review: pending
level: L1
products: [SOC, IRE]
basis:
- 中国人民银行业务领域网络安全事件报告管理办法（中国人民银行令〔2025〕第4号）
- 银行保险机构数据安全管理办法（金规〔2024〕24号）
- 中国人民银行业务领域数据安全管理办法（中国人民银行令〔2025〕第3号）
- 银行保险机构信息科技外包风险监管办法（银保监办发〔2021〕141号）
- 商业银行业务连续性监管指引（银监发〔2011〕104号）
- 商业银行信息科技风险管理指引（银监发〔2009〕19号）
- 银行保险机构操作风险管理办法（国家金融监督管理总局令2023年第5号）
- JR/T 0071-2020
terms:
- 核心系统：账务处理与客户账户的主系统，SOC 监测的最高优先级对象
- 网银与手机银行：面向个人和企业客户的线上渠道，撞库、欺诈、拒绝服务的主要攻击面
- 柜面系统：网点柜员使用的业务系统，终端分散，重点是终端与权限管控
- 支付与清算类系统：连接人民银行支付清算体系、银行卡组织和第三方支付，事件分级要考虑业务高峰
- 信贷、理财、票据等业务系统：按业务条线划分，数据敏感度不同
- 反欺诈（风控）平台：交易监控与欺诈识别，是与 SOC 告警联动的主要对象
- 数据仓库与大数据平台：数据集中处，数据安全分类分级的重点
- 开放接口与外联专线：与同业、监管、第三方机构互联的接口，监测盲区常在这里
- 自助设备与远程终端：自助机具等，恶意程序与物理篡改风险
- 两地三中心：同城灾备加异地灾备的部署方式，演练与切换记录是事件复盘的核查点
- 总行、分行、支行：报告对象与责任层级随机构层级变化
- 金融从业机构：人民银行事件报告办法的用语，指适用该办法的机构
- 事件分级：特别重大、重大、较大、一般四级，标准由机构自定并每年评估
- 事发简要报告、事发报告：较大以上事件分别于 1 小时、24 小时内报送
- 事中进展报告：重大以上事件至少每 2 小时一次，直至处置结束
- 事后调查总结报告：处置结束后 10 个工作日内报送
- 事件台账：记录事发与报告时间、接报联系人，至少留存三年
- 信息科技外包：把原由自身负责的科技工作交外部机构，受外包监管文件约束
- 业务连续性：灾备、应急预案与演练，RTO、RPO 是常用目标指标
roles:
- 科技条线分管领导（首席信息官或同级）
- 信息科技部（安全管理岗、运维岗、开发岗）
- 风险合规部（操作风险与合规岗、监管报告联络岗）
- 运行维护中心（值班与监控岗）
- 业务部门（零售、对公、渠道运营）
- 电子银行或渠道运营岗（渠道欺诈、撞库、客诉）
- 办公室或舆情负责人（对外口径）
- 采购与外包管理岗
- 审计部（内部审计岗）
threats:
- 金融欺诈与账户盗用
- 客户数据窃取与泄露
- 线上渠道的拒绝服务与撞库
- 第三方外包与供应链风险
- 勒索与业务中断
- 内部人员违规操作与数据外发
- 钓鱼与社会工程针对员工
- 外联接口与开放接口的滥用
- 自助设备与终端的恶意程序
gates:
- id: bank-regulatory-section
  kind: required_sections
  deliverable: D4
  sections:
  - 监管要求对照
  level: major
  message: 现状评估或差距评估报告缺少“监管要求对照”章节（银行业事件报告、外包、数据安全等要求须逐项对照现状）
- id: bank-no-conclusion
  kind: forbidden_terms
  deliverable: ''
  terms:
  - 已通过监管检查
  - 完全满足监管要求
  - 符合监管要求的结论
  level: blocking
  message: 交付件出现了监管或检查结论性表述；只能写差距分析、符合性初判、整改建议
instructions:
  facts: 行业包“银行”：整理事实时按渠道（网银、手机银行、柜面、支付清算、外联接口）分章，并单列“事件分级与报告机制”和“外包与第三方”；银行类调研题与追问见知识库条目 ind-bank-tpl-soc-questions、ind-bank-tpl-ire-questions。
  gap: 行业包“银行”：差距分析须补查银行业监管文件中与本产品相关的要求（依据只来自知识库，未入库的标【依据待核实】），并说明与等保要求重叠的部分；事件报告时限、分级标准、外包管理各列一项。判断规则见知识库条目 ind-bank-mtd-soc-judgment-rules、ind-bank-mtd-ire-judgment-rules（按产品取用，检索不到时不引用）。
  policy: 行业包“银行”：起草流程或预案时，升级与对外报告环节须对应人民银行事件报告办法的分级与时限，联系人写岗位不写姓名。
